# Full pull-based production: API, worker, and approval UI from GHCR (no Node/Python compile on Droplet).
# Build images in GitHub Actions first:
#   - .github/workflows/container-images.yml  (API_IMAGE)
#   - .github/workflows/container-images-ui.yml (APPROVAL_UI_IMAGE; pass real PUBLIC_API_URL as input)
#
# deploy/.env must set API_IMAGE, APPROVAL_UI_IMAGE, and all other vars from env.production.example.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-worker-parking-cmd: &worker-parking-cmd
  ["celery", "-A", "app.celery_app", "worker", "-l", "INFO", "-Q", "parking", "--concurrency=2", "-n", "parking@%h"]

x-worker-slack-cmd: &worker-slack-cmd
  ["celery", "-A", "app.celery_app", "worker", "-l", "INFO", "-Q", "slack", "--concurrency=1", "-n", "slack@%h"]

x-worker-beat-env: &worker-beat-env
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
  PILOT_CONFIG_PATH: /app/config/pilot.yaml
  PILOT_STRATEGIC_CONFIG_PATH: /app/config/pilot_strategic.yaml
  PILOT_IDENTIFICATION_CONFIG_PATH: /app/config/pilot_identification.yaml
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
  STORAGE_BUCKET: ${STORAGE_BUCKET}
  STORAGE_REGION: ${STORAGE_REGION}
  ZONING_RULES_PATH: ${ZONING_RULES_PATH:-}
  SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
  SLACK_DIGEST_CHANNEL_ID: ${SLACK_DIGEST_CHANNEL_ID:-}
  SLACK_AGENT_DISCUSSION_CHANNEL_ID: ${SLACK_AGENT_DISCUSSION_CHANNEL_ID:-}
  SLACK_AGENT_EVENT_UPDATES: ${SLACK_AGENT_EVENT_UPDATES:-}
  SLACK_PLAN_PROGRESS_CRONTAB_MINUTE: ${SLACK_PLAN_PROGRESS_CRONTAB_MINUTE:-5}
  SLACK_PLAN_PROGRESS_CRONTAB_HOUR: "${SLACK_PLAN_PROGRESS_CRONTAB_HOUR:-*}"
  SCHEDULED_GEOJSON_INGEST_PATH: ${SCHEDULED_GEOJSON_INGEST_PATH:-}
  SCHEDULED_GEOJSON_INGEST_DEFAULT_COUNTY_FIPS: ${SCHEDULED_GEOJSON_INGEST_DEFAULT_COUNTY_FIPS:-}
  SCHEDULED_GEOJSON_INGEST_AUTO_RUN_PIPELINE: ${SCHEDULED_GEOJSON_INGEST_AUTO_RUN_PIPELINE:-false}
  SCHEDULED_GEOJSON_INGEST_MAX_AUTO_PIPELINE: ${SCHEDULED_GEOJSON_INGEST_MAX_AUTO_PIPELINE:-100}
  SCHEDULED_GEOJSON_INGEST_CRONTAB_HOUR: ${SCHEDULED_GEOJSON_INGEST_CRONTAB_HOUR:-7}
  SCHEDULED_GEOJSON_INGEST_CRONTAB_MINUTE: ${SCHEDULED_GEOJSON_INGEST_CRONTAB_MINUTE:-0}
  SCHEDULED_ENQUEUE_UNSCORED_ENABLED: ${SCHEDULED_ENQUEUE_UNSCORED_ENABLED:-false}
  SCHEDULED_ENQUEUE_UNSCORED_LIMIT: ${SCHEDULED_ENQUEUE_UNSCORED_LIMIT:-150}
  SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_MINUTE: ${SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_MINUTE:-25}
  SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_HOUR: "${SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_HOUR:-*/4}"
  SCHEDULED_REFRESH_IDENTIFICATION_ENABLED: ${SCHEDULED_REFRESH_IDENTIFICATION_ENABLED:-false}
  SCHEDULED_REFRESH_IDENTIFICATION_LIMIT: ${SCHEDULED_REFRESH_IDENTIFICATION_LIMIT:-2000}
  SCHEDULED_REFRESH_IDENTIFICATION_CRONTAB_MINUTE: ${SCHEDULED_REFRESH_IDENTIFICATION_CRONTAB_MINUTE:-10}
  SCHEDULED_REFRESH_IDENTIFICATION_CRONTAB_HOUR: "${SCHEDULED_REFRESH_IDENTIFICATION_CRONTAB_HOUR:-*/6}"
  SCHEDULED_REFRESH_IDENTIFICATION_COUNTY_FIPS: ${SCHEDULED_REFRESH_IDENTIFICATION_COUNTY_FIPS:-}
  SCHEDULED_REFRESH_DEMAND_ENABLED: ${SCHEDULED_REFRESH_DEMAND_ENABLED:-false}
  SCHEDULED_REFRESH_DEMAND_LIMIT: ${SCHEDULED_REFRESH_DEMAND_LIMIT:-2000}
  SCHEDULED_REFRESH_DEMAND_CRONTAB_MINUTE: ${SCHEDULED_REFRESH_DEMAND_CRONTAB_MINUTE:-40}
  SCHEDULED_REFRESH_DEMAND_CRONTAB_HOUR: "${SCHEDULED_REFRESH_DEMAND_CRONTAB_HOUR:-*/6}"
  SCHEDULED_REFRESH_DEMAND_COUNTY_FIPS: ${SCHEDULED_REFRESH_DEMAND_COUNTY_FIPS:-}
  EXPLORATION_CAMPAIGN_ENABLED: ${EXPLORATION_CAMPAIGN_ENABLED:-false}
  EXPLORATION_CAMPAIGN_CONFIG_PATH: ${EXPLORATION_CAMPAIGN_CONFIG_PATH:-/app/config/exploration_campaign_wa.yaml}
  EXPLORATION_CAMPAIGN_CRONTAB_HOUR: ${EXPLORATION_CAMPAIGN_CRONTAB_HOUR:-6}
  EXPLORATION_CAMPAIGN_CRONTAB_MINUTE: ${EXPLORATION_CAMPAIGN_CRONTAB_MINUTE:-30}
  EXPLORATION_CAMPAIGN_START_DATE: ${EXPLORATION_CAMPAIGN_START_DATE:-}
  OPS_REMEDIATION_ENABLED: ${OPS_REMEDIATION_ENABLED:-true}
  OPS_REMEDIATION_AUTO_FIX: ${OPS_REMEDIATION_AUTO_FIX:-true}
  OPS_REMEDIATION_ALLOW_DB_WRITES: ${OPS_REMEDIATION_ALLOW_DB_WRITES:-false}
  OPS_REMEDIATION_PRIORITY_COUNTY_FIPS: ${OPS_REMEDIATION_PRIORITY_COUNTY_FIPS:-24510}
  OPS_REMEDIATION_BATCH_LIMIT: ${OPS_REMEDIATION_BATCH_LIMIT:-2000}
  OPS_REMEDIATION_POI_BATCH_LIMIT: ${OPS_REMEDIATION_POI_BATCH_LIMIT:-50}
  OPS_REMEDIATION_PIPELINE_ENQUEUE_LIMIT: ${OPS_REMEDIATION_PIPELINE_ENQUEUE_LIMIT:-75}
  OPS_REMEDIATION_COOLDOWN_SEC: ${OPS_REMEDIATION_COOLDOWN_SEC:-3600}
  OPS_REMEDIATION_HEARTBEAT_HOURS: ${OPS_REMEDIATION_HEARTBEAT_HOURS:-12}
  OPS_REMEDIATION_CRONTAB_MINUTE: ${OPS_REMEDIATION_CRONTAB_MINUTE:-15}
  OPS_REMEDIATION_CRONTAB_HOUR: "${OPS_REMEDIATION_CRONTAB_HOUR:-*/2}"
  OPS_REMEDIATION_SLACK_CHANNEL_ID: ${OPS_REMEDIATION_SLACK_CHANNEL_ID:-}

services:
  redis:
    image: redis:7-alpine
    restart: always
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "512mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  api:
    image: ${API_IMAGE:?Set API_IMAGE to ghcr.io/<owner>/parking-acquisition-api:<tag>}
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      PILOT_CONFIG_PATH: /app/config/pilot.yaml
      PILOT_STRATEGIC_CONFIG_PATH: /app/config/pilot_strategic.yaml
      PILOT_IDENTIFICATION_CONFIG_PATH: /app/config/pilot_identification.yaml
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_REGION: ${STORAGE_REGION}
      ZONING_RULES_PATH: ${ZONING_RULES_PATH:-}
      API_PUBLIC_URL: ${PUBLIC_API_URL}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_DIGEST_CHANNEL_ID: ${SLACK_DIGEST_CHANNEL_ID:-}
      SLACK_AGENT_DISCUSSION_CHANNEL_ID: ${SLACK_AGENT_DISCUSSION_CHANNEL_ID:-}
      SLACK_AGENT_EVENT_UPDATES: ${SLACK_AGENT_EVENT_UPDATES:-}
      SLACK_PLAN_PROGRESS_CRONTAB_MINUTE: ${SLACK_PLAN_PROGRESS_CRONTAB_MINUTE:-5}
      SLACK_PLAN_PROGRESS_CRONTAB_HOUR: "${SLACK_PLAN_PROGRESS_CRONTAB_HOUR:-*}"
      SCHEDULED_GEOJSON_INGEST_PATH: ${SCHEDULED_GEOJSON_INGEST_PATH:-}
      SCHEDULED_GEOJSON_INGEST_DEFAULT_COUNTY_FIPS: ${SCHEDULED_GEOJSON_INGEST_DEFAULT_COUNTY_FIPS:-}
      SCHEDULED_GEOJSON_INGEST_AUTO_RUN_PIPELINE: ${SCHEDULED_GEOJSON_INGEST_AUTO_RUN_PIPELINE:-false}
      SCHEDULED_GEOJSON_INGEST_MAX_AUTO_PIPELINE: ${SCHEDULED_GEOJSON_INGEST_MAX_AUTO_PIPELINE:-100}
      SCHEDULED_GEOJSON_INGEST_CRONTAB_HOUR: ${SCHEDULED_GEOJSON_INGEST_CRONTAB_HOUR:-7}
      SCHEDULED_GEOJSON_INGEST_CRONTAB_MINUTE: ${SCHEDULED_GEOJSON_INGEST_CRONTAB_MINUTE:-0}
      SCHEDULED_ENQUEUE_UNSCORED_ENABLED: ${SCHEDULED_ENQUEUE_UNSCORED_ENABLED:-false}
      SCHEDULED_ENQUEUE_UNSCORED_LIMIT: ${SCHEDULED_ENQUEUE_UNSCORED_LIMIT:-150}
      SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_MINUTE: ${SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_MINUTE:-25}
      SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_HOUR: "${SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_HOUR:-*/4}"
      SCHEDULED_REFRESH_IDENTIFICATION_ENABLED: ${SCHEDULED_REFRESH_IDENTIFICATION_ENABLED:-false}
      SCHEDULED_REFRESH_IDENTIFICATION_LIMIT: ${SCHEDULED_REFRESH_IDENTIFICATION_LIMIT:-2000}
      SCHEDULED_REFRESH_IDENTIFICATION_CRONTAB_MINUTE: ${SCHEDULED_REFRESH_IDENTIFICATION_CRONTAB_MINUTE:-10}
      SCHEDULED_REFRESH_IDENTIFICATION_CRONTAB_HOUR: "${SCHEDULED_REFRESH_IDENTIFICATION_CRONTAB_HOUR:-*/6}"
      SCHEDULED_REFRESH_IDENTIFICATION_COUNTY_FIPS: ${SCHEDULED_REFRESH_IDENTIFICATION_COUNTY_FIPS:-}
      SCHEDULED_REFRESH_DEMAND_ENABLED: ${SCHEDULED_REFRESH_DEMAND_ENABLED:-false}
      SCHEDULED_REFRESH_DEMAND_LIMIT: ${SCHEDULED_REFRESH_DEMAND_LIMIT:-2000}
      SCHEDULED_REFRESH_DEMAND_CRONTAB_MINUTE: ${SCHEDULED_REFRESH_DEMAND_CRONTAB_MINUTE:-40}
      SCHEDULED_REFRESH_DEMAND_CRONTAB_HOUR: "${SCHEDULED_REFRESH_DEMAND_CRONTAB_HOUR:-*/6}"
      SCHEDULED_REFRESH_DEMAND_COUNTY_FIPS: ${SCHEDULED_REFRESH_DEMAND_COUNTY_FIPS:-}
      EXPLORATION_CAMPAIGN_ENABLED: ${EXPLORATION_CAMPAIGN_ENABLED:-false}
      EXPLORATION_CAMPAIGN_CONFIG_PATH: ${EXPLORATION_CAMPAIGN_CONFIG_PATH:-/app/config/exploration_campaign_wa.yaml}
      EXPLORATION_CAMPAIGN_CRONTAB_HOUR: ${EXPLORATION_CAMPAIGN_CRONTAB_HOUR:-6}
      EXPLORATION_CAMPAIGN_CRONTAB_MINUTE: ${EXPLORATION_CAMPAIGN_CRONTAB_MINUTE:-30}
      EXPLORATION_CAMPAIGN_START_DATE: ${EXPLORATION_CAMPAIGN_START_DATE:-}
      OPS_REMEDIATION_ENABLED: ${OPS_REMEDIATION_ENABLED:-true}
      OPS_REMEDIATION_AUTO_FIX: ${OPS_REMEDIATION_AUTO_FIX:-true}
      OPS_REMEDIATION_ALLOW_DB_WRITES: ${OPS_REMEDIATION_ALLOW_DB_WRITES:-false}
      OPS_REMEDIATION_PRIORITY_COUNTY_FIPS: ${OPS_REMEDIATION_PRIORITY_COUNTY_FIPS:-24510}
      OPS_REMEDIATION_BATCH_LIMIT: ${OPS_REMEDIATION_BATCH_LIMIT:-2000}
      OPS_REMEDIATION_POI_BATCH_LIMIT: ${OPS_REMEDIATION_POI_BATCH_LIMIT:-50}
      OPS_REMEDIATION_PIPELINE_ENQUEUE_LIMIT: ${OPS_REMEDIATION_PIPELINE_ENQUEUE_LIMIT:-75}
      OPS_REMEDIATION_COOLDOWN_SEC: ${OPS_REMEDIATION_COOLDOWN_SEC:-3600}
      OPS_REMEDIATION_HEARTBEAT_HOURS: ${OPS_REMEDIATION_HEARTBEAT_HOURS:-12}
      OPS_REMEDIATION_CRONTAB_MINUTE: ${OPS_REMEDIATION_CRONTAB_MINUTE:-15}
      OPS_REMEDIATION_CRONTAB_HOUR: "${OPS_REMEDIATION_CRONTAB_HOUR:-*/2}"
      OPS_REMEDIATION_SLACK_CHANNEL_ID: ${OPS_REMEDIATION_SLACK_CHANNEL_ID:-}
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data:ro
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

  worker:
    image: ${API_IMAGE:?Same image as api service}
    restart: always
    command: *worker-parking-cmd
    environment:
      <<: *worker-beat-env
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    logging: *default-logging

  worker-slack:
    image: ${API_IMAGE:?Same image as worker — dedicated Slack digest queue}
    restart: always
    command: *worker-slack-cmd
    environment:
      <<: *worker-beat-env
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    logging: *default-logging

  beat:
    image: ${API_IMAGE:?Same image as worker}
    restart: always
    command: ["celery", "-A", "app.celery_app", "beat", "-l", "INFO"]
    environment:
      <<: *worker-beat-env
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    logging: *default-logging

  approval-ui:
    image: ${APPROVAL_UI_IMAGE:?Set APPROVAL_UI_IMAGE to ghcr.io/<owner>/parking-acquisition-approval-ui:<tag>}
    restart: always
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
      API_SERVER_URL: http://api:8000
    expose:
      - "3000"
    depends_on:
      - api
    logging: *default-logging

  operator-console:
    build:
      context: ..
      dockerfile: apps/operator-console/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    restart: always
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
      API_SERVER_URL: http://api:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_started
    logging: *default-logging

  caddy:
    image: caddy:2.8-alpine
    restart: always
    ports:
      - "${CADDY_PUBLISH_HTTP:-80}:80"
      - "${CADDY_PUBLISH_HTTPS:-443}:443"
    environment:
      UI_HOST: ${UI_HOST}
      API_HOST: ${API_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deploy/.env for Let's Encrypt}
    volumes:
      - ${CADDY_CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - approval-ui
      - operator-console
    logging: *default-logging

volumes:
  redis_data:
  caddy_data:
  caddy_config:
