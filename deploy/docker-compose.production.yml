# Production stack on a single DigitalOcean Droplet (24/7).
# Uses Managed Postgres + Spaces (not container Postgres/MinIO). Redis runs on the Droplet.
#
# On the server: copy repo to e.g. /opt/parking-acquisition-agents, create deploy/.env from
# env.production.example (must live next to this file). UI containers load deploy/.env via env_file.
# Then:
#   docker compose -f deploy/docker-compose.production.yml --env-file deploy/.env up -d --build

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-worker-parking-cmd: &worker-parking-cmd
  ["celery", "-A", "app.celery_app", "worker", "-l", "INFO", "-Q", "parking", "--concurrency=2", "-n", "parking@%h"]

x-worker-slack-cmd: &worker-slack-cmd
  ["celery", "-A", "app.celery_app", "worker", "-l", "INFO", "-Q", "slack", "--concurrency=1", "-n", "slack@%h"]

# Shared env for Celery worker + beat (imports app + DB at startup).
x-worker-beat-env: &worker-beat-env
  APP_VERSION: ${APP_VERSION:-dev}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
  PILOT_CONFIG_PATH: /app/config/pilot.yaml
  PILOT_STRATEGIC_CONFIG_PATH: /app/config/pilot_strategic.yaml
  PILOT_IDENTIFICATION_CONFIG_PATH: /app/config/pilot_identification.yaml
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
  STORAGE_BUCKET: ${STORAGE_BUCKET}
  STORAGE_REGION: ${STORAGE_REGION}
  ZONING_RULES_PATH: ${ZONING_RULES_PATH:-}
  SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
  SLACK_DIGEST_CHANNEL_ID: ${SLACK_DIGEST_CHANNEL_ID:-}
  SLACK_AGENT_DISCUSSION_CHANNEL_ID: ${SLACK_AGENT_DISCUSSION_CHANNEL_ID:-}
  SLACK_AGENT_EVENT_UPDATES: ${SLACK_AGENT_EVENT_UPDATES:-}
  SLACK_DIGEST_CRONTAB_MINUTE: ${SLACK_DIGEST_CRONTAB_MINUTE:-0}
  SLACK_DIGEST_CRONTAB_HOUR: "${SLACK_DIGEST_CRONTAB_HOUR:-*}"
  SLACK_DIGEST_WINDOW_HOURS: ${SLACK_DIGEST_WINDOW_HOURS:-1}
  SLACK_PLAN_PROGRESS_CRONTAB_MINUTE: ${SLACK_PLAN_PROGRESS_CRONTAB_MINUTE:-5}
  SLACK_PLAN_PROGRESS_CRONTAB_HOUR: "${SLACK_PLAN_PROGRESS_CRONTAB_HOUR:-*}"
  # Optional Beat schedule (see deploy/env.production.example); worker + beat must match.
  SCHEDULED_GEOJSON_INGEST_PATH: ${SCHEDULED_GEOJSON_INGEST_PATH:-}
  SCHEDULED_GEOJSON_INGEST_DEFAULT_COUNTY_FIPS: ${SCHEDULED_GEOJSON_INGEST_DEFAULT_COUNTY_FIPS:-}
  SCHEDULED_GEOJSON_INGEST_AUTO_RUN_PIPELINE: ${SCHEDULED_GEOJSON_INGEST_AUTO_RUN_PIPELINE:-false}
  SCHEDULED_GEOJSON_INGEST_MAX_AUTO_PIPELINE: ${SCHEDULED_GEOJSON_INGEST_MAX_AUTO_PIPELINE:-100}
  SCHEDULED_GEOJSON_INGEST_CRONTAB_HOUR: ${SCHEDULED_GEOJSON_INGEST_CRONTAB_HOUR:-7}
  SCHEDULED_GEOJSON_INGEST_CRONTAB_MINUTE: ${SCHEDULED_GEOJSON_INGEST_CRONTAB_MINUTE:-0}
  SCHEDULED_ENQUEUE_UNSCORED_ENABLED: ${SCHEDULED_ENQUEUE_UNSCORED_ENABLED:-true}
  SCHEDULED_ENQUEUE_UNSCORED_LIMIT: ${SCHEDULED_ENQUEUE_UNSCORED_LIMIT:-150}
  SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_MINUTE: ${SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_MINUTE:-25}
  SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_HOUR: "${SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_HOUR:-*/4}"
  # Optional Beat: Cartographer / Beacon batch refreshes (same tasks as execute-phase-a.sh HTTP steps).
  SCHEDULED_REFRESH_IDENTIFICATION_ENABLED: ${SCHEDULED_REFRESH_IDENTIFICATION_ENABLED:-false}
  SCHEDULED_REFRESH_IDENTIFICATION_LIMIT: ${SCHEDULED_REFRESH_IDENTIFICATION_LIMIT:-2000}
  SCHEDULED_REFRESH_IDENTIFICATION_CRONTAB_MINUTE: ${SCHEDULED_REFRESH_IDENTIFICATION_CRONTAB_MINUTE:-10}
  SCHEDULED_REFRESH_IDENTIFICATION_CRONTAB_HOUR: "${SCHEDULED_REFRESH_IDENTIFICATION_CRONTAB_HOUR:-*/6}"
  SCHEDULED_REFRESH_IDENTIFICATION_COUNTY_FIPS: ${SCHEDULED_REFRESH_IDENTIFICATION_COUNTY_FIPS:-}
  SCHEDULED_REFRESH_DEMAND_ENABLED: ${SCHEDULED_REFRESH_DEMAND_ENABLED:-false}
  SCHEDULED_REFRESH_DEMAND_LIMIT: ${SCHEDULED_REFRESH_DEMAND_LIMIT:-2000}
  SCHEDULED_REFRESH_DEMAND_CRONTAB_MINUTE: ${SCHEDULED_REFRESH_DEMAND_CRONTAB_MINUTE:-40}
  SCHEDULED_REFRESH_DEMAND_CRONTAB_HOUR: "${SCHEDULED_REFRESH_DEMAND_CRONTAB_HOUR:-*/6}"
  SCHEDULED_REFRESH_DEMAND_COUNTY_FIPS: ${SCHEDULED_REFRESH_DEMAND_COUNTY_FIPS:-}
  # WA 7-day exploration campaign (optional). Set EXPLORATION_CAMPAIGN_START_DATE in deploy/.env only when running.
  EXPLORATION_CAMPAIGN_ENABLED: ${EXPLORATION_CAMPAIGN_ENABLED:-false}
  EXPLORATION_CAMPAIGN_CONFIG_PATH: ${EXPLORATION_CAMPAIGN_CONFIG_PATH:-/app/config/exploration_campaign_wa.yaml}
  EXPLORATION_CAMPAIGN_CRONTAB_HOUR: ${EXPLORATION_CAMPAIGN_CRONTAB_HOUR:-6}
  EXPLORATION_CAMPAIGN_CRONTAB_MINUTE: ${EXPLORATION_CAMPAIGN_CRONTAB_MINUTE:-30}
  EXPLORATION_CAMPAIGN_START_DATE: ${EXPLORATION_CAMPAIGN_START_DATE:-}
  WA_STATEWIDE_ROLLOUT_ENABLED: ${WA_STATEWIDE_ROLLOUT_ENABLED:-false}
  WA_STATEWIDE_ROLLOUT_CONFIG_PATH: ${WA_STATEWIDE_ROLLOUT_CONFIG_PATH:-/app/config/wa_statewide_rollout.yaml}
  WA_STATEWIDE_ROLLOUT_CRONTAB_HOUR: "${WA_STATEWIDE_ROLLOUT_CRONTAB_HOUR:-*}"
  WA_STATEWIDE_ROLLOUT_CRONTAB_MINUTE: ${WA_STATEWIDE_ROLLOUT_CRONTAB_MINUTE:-15}
  ADDRESS_HEALTH_AGENT_ENABLED: ${ADDRESS_HEALTH_AGENT_ENABLED:-true}
  ADDRESS_HEALTH_AGENT_CRONTAB_HOUR: "${ADDRESS_HEALTH_AGENT_CRONTAB_HOUR:-*/12}"
  ADDRESS_HEALTH_AGENT_CRONTAB_MINUTE: ${ADDRESS_HEALTH_AGENT_CRONTAB_MINUTE:-10}
  SCHEDULED_PRIORITY_PIPELINE_ENABLED: ${SCHEDULED_PRIORITY_PIPELINE_ENABLED:-false}
  SCHEDULED_PRIORITY_PIPELINE_LIMIT: ${SCHEDULED_PRIORITY_PIPELINE_LIMIT:-75}
  SCHEDULED_PRIORITY_PIPELINE_CRONTAB_HOUR: "${SCHEDULED_PRIORITY_PIPELINE_CRONTAB_HOUR:-*/2}"
  SCHEDULED_PRIORITY_PIPELINE_CRONTAB_MINUTE: ${SCHEDULED_PRIORITY_PIPELINE_CRONTAB_MINUTE:-20}
  OPS_REMEDIATION_ENABLED: ${OPS_REMEDIATION_ENABLED:-true}
  OPS_REMEDIATION_AUTO_FIX: ${OPS_REMEDIATION_AUTO_FIX:-true}
  OPS_REMEDIATION_ALLOW_DB_WRITES: ${OPS_REMEDIATION_ALLOW_DB_WRITES:-false}
  OPS_REMEDIATION_PRIORITY_COUNTY_FIPS: ${OPS_REMEDIATION_PRIORITY_COUNTY_FIPS:-24510}
  OPS_REMEDIATION_BATCH_LIMIT: ${OPS_REMEDIATION_BATCH_LIMIT:-2000}
  OPS_REMEDIATION_POI_BATCH_LIMIT: ${OPS_REMEDIATION_POI_BATCH_LIMIT:-50}
  OPS_REMEDIATION_PIPELINE_ENQUEUE_LIMIT: ${OPS_REMEDIATION_PIPELINE_ENQUEUE_LIMIT:-75}
  OPS_REMEDIATION_COOLDOWN_SEC: ${OPS_REMEDIATION_COOLDOWN_SEC:-3600}
  OPS_REMEDIATION_HEARTBEAT_HOURS: ${OPS_REMEDIATION_HEARTBEAT_HOURS:-12}
  OPS_REMEDIATION_CRONTAB_MINUTE: ${OPS_REMEDIATION_CRONTAB_MINUTE:-15}
  OPS_REMEDIATION_CRONTAB_HOUR: "${OPS_REMEDIATION_CRONTAB_HOUR:-*/2}"
  OPS_REMEDIATION_SLACK_CHANNEL_ID: ${OPS_REMEDIATION_SLACK_CHANNEL_ID:-}
  API_PUBLIC_URL: ${PUBLIC_API_URL:-}
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
  SITE_WATCHDOG_ENABLED: ${SITE_WATCHDOG_ENABLED:-true}
  SITE_WATCHDOG_UI_BASE_URL: ${SITE_WATCHDOG_UI_BASE_URL:-}
  SITE_WATCHDOG_INTERNAL_API_URL: ${SITE_WATCHDOG_INTERNAL_API_URL:-http://api:8000}
  SITE_WATCHDOG_INTERNAL_UI_URL: ${SITE_WATCHDOG_INTERNAL_UI_URL:-http://operator-console:3000}
  SITE_WATCHDOG_RETRY_COUNT: ${SITE_WATCHDOG_RETRY_COUNT:-3}
  SITE_WATCHDOG_RETRY_DELAY_SECONDS: ${SITE_WATCHDOG_RETRY_DELAY_SECONDS:-5}
  SITE_WATCHDOG_SLACK_CHANNEL_ID: ${SITE_WATCHDOG_SLACK_CHANNEL_ID:-}
  SITE_WATCHDOG_PARKING_QUEUE_WARN: ${SITE_WATCHDOG_PARKING_QUEUE_WARN:-50000}
  SITE_WATCHDOG_HEARTBEAT_HOURS: ${SITE_WATCHDOG_HEARTBEAT_HOURS:-1}
  SITE_WATCHDOG_FAILURE_REPEAT_HOURS: ${SITE_WATCHDOG_FAILURE_REPEAT_HOURS:-6}
  SITE_WATCHDOG_CRONTAB_MINUTE: ${SITE_WATCHDOG_CRONTAB_MINUTE:-0}
  OWNER_VENDOR_LOOKUP_ENABLED: ${OWNER_VENDOR_LOOKUP_ENABLED:-false}
  OWNER_VENDOR_LOOKUP_URL: ${OWNER_VENDOR_LOOKUP_URL:-}
  OWNER_VENDOR_LOOKUP_API_KEY: ${OWNER_VENDOR_LOOKUP_API_KEY:-}
  OWNER_OUTREACH_MIN_ENTITLEMENT_SCORE: ${OWNER_OUTREACH_MIN_ENTITLEMENT_SCORE:-85}
  OWNER_OUTREACH_MIN_STRATEGIC_SCORE: ${OWNER_OUTREACH_MIN_STRATEGIC_SCORE:-80}

services:
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  api:
    build:
      context: ..
      dockerfile: Dockerfile.backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: always
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      PILOT_CONFIG_PATH: /app/config/pilot.yaml
      PILOT_STRATEGIC_CONFIG_PATH: /app/config/pilot_strategic.yaml
      PILOT_IDENTIFICATION_CONFIG_PATH: /app/config/pilot_identification.yaml
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_REGION: ${STORAGE_REGION}
      ZONING_RULES_PATH: ${ZONING_RULES_PATH:-}
      API_PUBLIC_URL: ${PUBLIC_API_URL}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_DIGEST_CHANNEL_ID: ${SLACK_DIGEST_CHANNEL_ID:-}
      SLACK_AGENT_DISCUSSION_CHANNEL_ID: ${SLACK_AGENT_DISCUSSION_CHANNEL_ID:-}
      SLACK_AGENT_EVENT_UPDATES: ${SLACK_AGENT_EVENT_UPDATES:-}
      SLACK_PLAN_PROGRESS_CRONTAB_MINUTE: ${SLACK_PLAN_PROGRESS_CRONTAB_MINUTE:-5}
      SLACK_PLAN_PROGRESS_CRONTAB_HOUR: "${SLACK_PLAN_PROGRESS_CRONTAB_HOUR:-*}"
      SCHEDULED_GEOJSON_INGEST_PATH: ${SCHEDULED_GEOJSON_INGEST_PATH:-}
      SCHEDULED_GEOJSON_INGEST_DEFAULT_COUNTY_FIPS: ${SCHEDULED_GEOJSON_INGEST_DEFAULT_COUNTY_FIPS:-}
      SCHEDULED_GEOJSON_INGEST_AUTO_RUN_PIPELINE: ${SCHEDULED_GEOJSON_INGEST_AUTO_RUN_PIPELINE:-false}
      SCHEDULED_GEOJSON_INGEST_MAX_AUTO_PIPELINE: ${SCHEDULED_GEOJSON_INGEST_MAX_AUTO_PIPELINE:-100}
      SCHEDULED_GEOJSON_INGEST_CRONTAB_HOUR: ${SCHEDULED_GEOJSON_INGEST_CRONTAB_HOUR:-7}
      SCHEDULED_GEOJSON_INGEST_CRONTAB_MINUTE: ${SCHEDULED_GEOJSON_INGEST_CRONTAB_MINUTE:-0}
      SCHEDULED_ENQUEUE_UNSCORED_ENABLED: ${SCHEDULED_ENQUEUE_UNSCORED_ENABLED:-true}
      SCHEDULED_ENQUEUE_UNSCORED_LIMIT: ${SCHEDULED_ENQUEUE_UNSCORED_LIMIT:-150}
      SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_MINUTE: ${SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_MINUTE:-25}
      SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_HOUR: "${SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_HOUR:-*/4}"
      SCHEDULED_REFRESH_IDENTIFICATION_ENABLED: ${SCHEDULED_REFRESH_IDENTIFICATION_ENABLED:-false}
      SCHEDULED_REFRESH_IDENTIFICATION_LIMIT: ${SCHEDULED_REFRESH_IDENTIFICATION_LIMIT:-2000}
      SCHEDULED_REFRESH_IDENTIFICATION_CRONTAB_MINUTE: ${SCHEDULED_REFRESH_IDENTIFICATION_CRONTAB_MINUTE:-10}
      SCHEDULED_REFRESH_IDENTIFICATION_CRONTAB_HOUR: "${SCHEDULED_REFRESH_IDENTIFICATION_CRONTAB_HOUR:-*/6}"
      SCHEDULED_REFRESH_IDENTIFICATION_COUNTY_FIPS: ${SCHEDULED_REFRESH_IDENTIFICATION_COUNTY_FIPS:-}
      SCHEDULED_REFRESH_DEMAND_ENABLED: ${SCHEDULED_REFRESH_DEMAND_ENABLED:-false}
      SCHEDULED_REFRESH_DEMAND_LIMIT: ${SCHEDULED_REFRESH_DEMAND_LIMIT:-2000}
      SCHEDULED_REFRESH_DEMAND_CRONTAB_MINUTE: ${SCHEDULED_REFRESH_DEMAND_CRONTAB_MINUTE:-40}
      SCHEDULED_REFRESH_DEMAND_CRONTAB_HOUR: "${SCHEDULED_REFRESH_DEMAND_CRONTAB_HOUR:-*/6}"
      SCHEDULED_REFRESH_DEMAND_COUNTY_FIPS: ${SCHEDULED_REFRESH_DEMAND_COUNTY_FIPS:-}
      EXPLORATION_CAMPAIGN_ENABLED: ${EXPLORATION_CAMPAIGN_ENABLED:-false}
      EXPLORATION_CAMPAIGN_CONFIG_PATH: ${EXPLORATION_CAMPAIGN_CONFIG_PATH:-/app/config/exploration_campaign_wa.yaml}
      EXPLORATION_CAMPAIGN_CRONTAB_HOUR: ${EXPLORATION_CAMPAIGN_CRONTAB_HOUR:-6}
      EXPLORATION_CAMPAIGN_CRONTAB_MINUTE: ${EXPLORATION_CAMPAIGN_CRONTAB_MINUTE:-30}
      EXPLORATION_CAMPAIGN_START_DATE: ${EXPLORATION_CAMPAIGN_START_DATE:-}
      WA_STATEWIDE_ROLLOUT_ENABLED: ${WA_STATEWIDE_ROLLOUT_ENABLED:-false}
      WA_STATEWIDE_ROLLOUT_CONFIG_PATH: ${WA_STATEWIDE_ROLLOUT_CONFIG_PATH:-/app/config/wa_statewide_rollout.yaml}
      OPS_REMEDIATION_ENABLED: ${OPS_REMEDIATION_ENABLED:-true}
      OPS_REMEDIATION_AUTO_FIX: ${OPS_REMEDIATION_AUTO_FIX:-true}
      OPS_REMEDIATION_ALLOW_DB_WRITES: ${OPS_REMEDIATION_ALLOW_DB_WRITES:-false}
      OPS_REMEDIATION_PRIORITY_COUNTY_FIPS: ${OPS_REMEDIATION_PRIORITY_COUNTY_FIPS:-24510}
      OPS_REMEDIATION_BATCH_LIMIT: ${OPS_REMEDIATION_BATCH_LIMIT:-2000}
      OPS_REMEDIATION_POI_BATCH_LIMIT: ${OPS_REMEDIATION_POI_BATCH_LIMIT:-50}
      OPS_REMEDIATION_PIPELINE_ENQUEUE_LIMIT: ${OPS_REMEDIATION_PIPELINE_ENQUEUE_LIMIT:-75}
      OPS_REMEDIATION_COOLDOWN_SEC: ${OPS_REMEDIATION_COOLDOWN_SEC:-3600}
      OPS_REMEDIATION_HEARTBEAT_HOURS: ${OPS_REMEDIATION_HEARTBEAT_HOURS:-12}
      OPS_REMEDIATION_CRONTAB_MINUTE: ${OPS_REMEDIATION_CRONTAB_MINUTE:-15}
      OPS_REMEDIATION_CRONTAB_HOUR: "${OPS_REMEDIATION_CRONTAB_HOUR:-*/2}"
      OPS_REMEDIATION_SLACK_CHANNEL_ID: ${OPS_REMEDIATION_SLACK_CHANNEL_ID:-}
      OWNER_VENDOR_LOOKUP_ENABLED: ${OWNER_VENDOR_LOOKUP_ENABLED:-false}
      OWNER_VENDOR_LOOKUP_URL: ${OWNER_VENDOR_LOOKUP_URL:-}
      OWNER_VENDOR_LOOKUP_API_KEY: ${OWNER_VENDOR_LOOKUP_API_KEY:-}
      OWNER_OUTREACH_MIN_ENTITLEMENT_SCORE: ${OWNER_OUTREACH_MIN_ENTITLEMENT_SCORE:-85}
      OWNER_OUTREACH_MIN_STRATEGIC_SCORE: ${OWNER_OUTREACH_MIN_STRATEGIC_SCORE:-80}
      LOB_API_KEY: ${LOB_API_KEY:-}
      LOB_FROM_NAME: ${LOB_FROM_NAME:-}
      LOB_FROM_ADDRESS_LINE1: ${LOB_FROM_ADDRESS_LINE1:-}
      LOB_FROM_ADDRESS_LINE2: ${LOB_FROM_ADDRESS_LINE2:-}
      LOB_FROM_ADDRESS_CITY: ${LOB_FROM_ADDRESS_CITY:-}
      LOB_FROM_ADDRESS_STATE: ${LOB_FROM_ADDRESS_STATE:-}
      LOB_FROM_ADDRESS_ZIP: ${LOB_FROM_ADDRESS_ZIP:-}
      LOB_MAIL_EXTRA_SERVICE: ${LOB_MAIL_EXTRA_SERVICE:-certified}
      LOB_SEND_ENABLED: ${LOB_SEND_ENABLED:-false}
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data:ro
      # Repo scripts (export CSV, etc.): works even if API image was built before COPY scripts.
      - ../scripts:/app/scripts:ro
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

  worker:
    build:
      context: ..
      dockerfile: Dockerfile.backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: always
    command: *worker-parking-cmd
    environment:
      <<: *worker-beat-env
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data:ro
      - ../data/operator-agent:/app/data/operator-agent:rw
      - ../data/jurisdictions/wa:/app/data/jurisdictions/wa:rw
    depends_on:
      redis:
        condition: service_healthy
    # Dockerfile.backend HEALTHCHECK curls :8000/health (API only). Celery has no HTTP server.
    healthcheck:
      disable: true
    logging: *default-logging

  worker-slack:
    build:
      context: ..
      dockerfile: Dockerfile.backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: always
    command: *worker-slack-cmd
    environment:
      <<: *worker-beat-env
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    logging: *default-logging

  beat:
    build:
      context: ..
      dockerfile: Dockerfile.backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: always
    command: ["celery", "-A", "app.celery_app", "beat", "-l", "INFO"]
    environment:
      <<: *worker-beat-env
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data:ro
    depends_on:
      redis:
        condition: service_healthy
    # Same as worker: inherited image HEALTHCHECK targets uvicorn, not Celery beat.
    healthcheck:
      disable: true
    logging: *default-logging

  approval-ui:
    build:
      context: ..
      dockerfile: apps/approval-ui/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    restart: always
    # Load AUTH_* from deploy/.env inside the container (avoids empty ${AUTH_SECRET:-} substitution).
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
      API_SERVER_URL: http://api:8000
    expose:
      - "3000"
    depends_on:
      - api
    logging: *default-logging

  operator-console:
    build:
      context: ..
      dockerfile: apps/operator-console/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    restart: always
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
      API_SERVER_URL: http://api:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_started
    logging: *default-logging

  caddy:
    image: caddy:2.8-alpine
    restart: always
    ports:
      - "${CADDY_PUBLISH_HTTP:-80}:80"
      - "${CADDY_PUBLISH_HTTPS:-443}:443"
    environment:
      UI_HOST: ${UI_HOST}
      API_HOST: ${API_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deploy/.env for Let's Encrypt}
    volumes:
      - ${CADDY_CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - approval-ui
      - operator-console
    logging: *default-logging

volumes:
  redis_data:
  caddy_data:
  caddy_config:
