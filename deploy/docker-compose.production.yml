# Production stack on a single DigitalOcean Droplet (24/7).
# Uses Managed Postgres + Spaces (not container Postgres/MinIO). Redis runs on the Droplet.
#
# On the server: copy repo to e.g. /opt/parking-acquisition-agents, create deploy/.env from
# env.production.example, then:
#   docker compose -f deploy/docker-compose.production.yml --env-file deploy/.env up -d --build

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# Shared env for Celery worker + beat (imports app + DB at startup).
x-worker-beat-env: &worker-beat-env
  APP_VERSION: ${APP_VERSION:-dev}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
  PILOT_CONFIG_PATH: /app/config/pilot.yaml
  PILOT_STRATEGIC_CONFIG_PATH: /app/config/pilot_strategic.yaml
  PILOT_IDENTIFICATION_CONFIG_PATH: /app/config/pilot_identification.yaml
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
  STORAGE_BUCKET: ${STORAGE_BUCKET}
  STORAGE_REGION: ${STORAGE_REGION}
  ZONING_RULES_PATH: ${ZONING_RULES_PATH:-}
  SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
  SLACK_DIGEST_CHANNEL_ID: ${SLACK_DIGEST_CHANNEL_ID:-}
  SLACK_AGENT_DISCUSSION_CHANNEL_ID: ${SLACK_AGENT_DISCUSSION_CHANNEL_ID:-}
  SLACK_AGENT_EVENT_UPDATES: ${SLACK_AGENT_EVENT_UPDATES:-}
  # Optional Beat schedule (see deploy/env.production.example); worker + beat must match.
  SCHEDULED_GEOJSON_INGEST_PATH: ${SCHEDULED_GEOJSON_INGEST_PATH:-}
  SCHEDULED_GEOJSON_INGEST_DEFAULT_COUNTY_FIPS: ${SCHEDULED_GEOJSON_INGEST_DEFAULT_COUNTY_FIPS:-}
  SCHEDULED_GEOJSON_INGEST_AUTO_RUN_PIPELINE: ${SCHEDULED_GEOJSON_INGEST_AUTO_RUN_PIPELINE:-false}
  SCHEDULED_GEOJSON_INGEST_MAX_AUTO_PIPELINE: ${SCHEDULED_GEOJSON_INGEST_MAX_AUTO_PIPELINE:-100}
  SCHEDULED_GEOJSON_INGEST_CRONTAB_HOUR: ${SCHEDULED_GEOJSON_INGEST_CRONTAB_HOUR:-7}
  SCHEDULED_GEOJSON_INGEST_CRONTAB_MINUTE: ${SCHEDULED_GEOJSON_INGEST_CRONTAB_MINUTE:-0}
  SCHEDULED_ENQUEUE_UNSCORED_ENABLED: ${SCHEDULED_ENQUEUE_UNSCORED_ENABLED:-true}
  SCHEDULED_ENQUEUE_UNSCORED_LIMIT: ${SCHEDULED_ENQUEUE_UNSCORED_LIMIT:-150}
  SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_MINUTE: ${SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_MINUTE:-25}
  SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_HOUR: "${SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_HOUR:-*/4}"
  # WA 7-day exploration campaign (optional). Set EXPLORATION_CAMPAIGN_START_DATE in deploy/.env only when running.
  EXPLORATION_CAMPAIGN_ENABLED: ${EXPLORATION_CAMPAIGN_ENABLED:-false}
  EXPLORATION_CAMPAIGN_CONFIG_PATH: ${EXPLORATION_CAMPAIGN_CONFIG_PATH:-/app/config/exploration_campaign_wa.yaml}
  EXPLORATION_CAMPAIGN_CRONTAB_HOUR: ${EXPLORATION_CAMPAIGN_CRONTAB_HOUR:-6}
  EXPLORATION_CAMPAIGN_CRONTAB_MINUTE: ${EXPLORATION_CAMPAIGN_CRONTAB_MINUTE:-30}
  EXPLORATION_CAMPAIGN_START_DATE: ${EXPLORATION_CAMPAIGN_START_DATE:-}

services:
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  api:
    build:
      context: ..
      dockerfile: Dockerfile.backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: always
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      PILOT_CONFIG_PATH: /app/config/pilot.yaml
      PILOT_STRATEGIC_CONFIG_PATH: /app/config/pilot_strategic.yaml
      PILOT_IDENTIFICATION_CONFIG_PATH: /app/config/pilot_identification.yaml
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_REGION: ${STORAGE_REGION}
      ZONING_RULES_PATH: ${ZONING_RULES_PATH:-}
      API_PUBLIC_URL: ${PUBLIC_API_URL}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_DIGEST_CHANNEL_ID: ${SLACK_DIGEST_CHANNEL_ID:-}
      SLACK_AGENT_DISCUSSION_CHANNEL_ID: ${SLACK_AGENT_DISCUSSION_CHANNEL_ID:-}
      SLACK_AGENT_EVENT_UPDATES: ${SLACK_AGENT_EVENT_UPDATES:-}
      SCHEDULED_GEOJSON_INGEST_PATH: ${SCHEDULED_GEOJSON_INGEST_PATH:-}
      SCHEDULED_GEOJSON_INGEST_DEFAULT_COUNTY_FIPS: ${SCHEDULED_GEOJSON_INGEST_DEFAULT_COUNTY_FIPS:-}
      SCHEDULED_GEOJSON_INGEST_AUTO_RUN_PIPELINE: ${SCHEDULED_GEOJSON_INGEST_AUTO_RUN_PIPELINE:-false}
      SCHEDULED_GEOJSON_INGEST_MAX_AUTO_PIPELINE: ${SCHEDULED_GEOJSON_INGEST_MAX_AUTO_PIPELINE:-100}
      SCHEDULED_GEOJSON_INGEST_CRONTAB_HOUR: ${SCHEDULED_GEOJSON_INGEST_CRONTAB_HOUR:-7}
      SCHEDULED_GEOJSON_INGEST_CRONTAB_MINUTE: ${SCHEDULED_GEOJSON_INGEST_CRONTAB_MINUTE:-0}
      SCHEDULED_ENQUEUE_UNSCORED_ENABLED: ${SCHEDULED_ENQUEUE_UNSCORED_ENABLED:-true}
      SCHEDULED_ENQUEUE_UNSCORED_LIMIT: ${SCHEDULED_ENQUEUE_UNSCORED_LIMIT:-150}
      SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_MINUTE: ${SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_MINUTE:-25}
      SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_HOUR: "${SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_HOUR:-*/4}"
      EXPLORATION_CAMPAIGN_ENABLED: ${EXPLORATION_CAMPAIGN_ENABLED:-false}
      EXPLORATION_CAMPAIGN_CONFIG_PATH: ${EXPLORATION_CAMPAIGN_CONFIG_PATH:-/app/config/exploration_campaign_wa.yaml}
      EXPLORATION_CAMPAIGN_CRONTAB_HOUR: ${EXPLORATION_CAMPAIGN_CRONTAB_HOUR:-6}
      EXPLORATION_CAMPAIGN_CRONTAB_MINUTE: ${EXPLORATION_CAMPAIGN_CRONTAB_MINUTE:-30}
      EXPLORATION_CAMPAIGN_START_DATE: ${EXPLORATION_CAMPAIGN_START_DATE:-}
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data:ro
      # Repo scripts (export CSV, etc.): works even if API image was built before COPY scripts.
      - ../scripts:/app/scripts:ro
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

  worker:
    build:
      context: ..
      dockerfile: Dockerfile.backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: always
    command: ["celery", "-A", "app.celery_app", "worker", "-l", "INFO", "--concurrency=2"]
    environment:
      <<: *worker-beat-env
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data:ro
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

  beat:
    build:
      context: ..
      dockerfile: Dockerfile.backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: always
    command: ["celery", "-A", "app.celery_app", "beat", "-l", "INFO"]
    environment:
      <<: *worker-beat-env
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data:ro
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

  approval-ui:
    build:
      context: ..
      dockerfile: apps/approval-ui/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    expose:
      - "3000"
    depends_on:
      - api
    logging: *default-logging

  caddy:
    image: caddy:2.8-alpine
    restart: always
    ports:
      - "${CADDY_PUBLISH_HTTP:-80}:80"
      - "${CADDY_PUBLISH_HTTPS:-443}:443"
    environment:
      UI_HOST: ${UI_HOST}
      API_HOST: ${API_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deploy/.env for Let's Encrypt}
    volumes:
      - ${CADDY_CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - approval-ui
    logging: *default-logging

volumes:
  redis_data:
  caddy_data:
  caddy_config:
