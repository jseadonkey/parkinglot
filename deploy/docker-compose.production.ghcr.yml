# Same as docker-compose.production.yml but API + worker use a pre-built image from GHCR
# (no compile on the Droplet). Build/push images via .github/workflows/container-images.yml.
#
# deploy/.env must set API_IMAGE, e.g.:
#   API_IMAGE=ghcr.io/yourgithubuser/parking-acquisition-api:latest
#
# On the Droplet (once): echo $GHCR_TOKEN | docker login ghcr.io -u USERNAME --password-stdin
# Use a GitHub PAT with read:packages (fine-grained: read access to packages).
#
# From repo root:
#   docker compose -f deploy/docker-compose.production.ghcr.yml --env-file deploy/.env pull
#   docker compose -f deploy/docker-compose.production.ghcr.yml --env-file deploy/.env up -d

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-worker-parking-cmd: &worker-parking-cmd
  ["celery", "-A", "app.celery_app", "worker", "-l", "INFO", "-Q", "parking", "--concurrency=4", "-n", "parking@%h"]

x-worker-slack-cmd: &worker-slack-cmd
  ["celery", "-A", "app.celery_app", "worker", "-l", "INFO", "-Q", "slack", "--concurrency=1", "-n", "slack@%h"]

x-worker-beat-env: &worker-beat-env
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
  PILOT_CONFIG_PATH: /app/config/pilot.yaml
  PILOT_STRATEGIC_CONFIG_PATH: /app/config/pilot_strategic.yaml
  PILOT_IDENTIFICATION_CONFIG_PATH: /app/config/pilot_identification.yaml
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
  STORAGE_BUCKET: ${STORAGE_BUCKET}
  STORAGE_REGION: ${STORAGE_REGION}
  ZONING_RULES_PATH: ${ZONING_RULES_PATH:-}
  SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
  SLACK_DIGEST_CHANNEL_ID: ${SLACK_DIGEST_CHANNEL_ID:-}
  SLACK_AGENT_DISCUSSION_CHANNEL_ID: ${SLACK_AGENT_DISCUSSION_CHANNEL_ID:-}
  SLACK_AGENT_EVENT_UPDATES: ${SLACK_AGENT_EVENT_UPDATES:-}
  SLACK_DIGEST_CRONTAB_MINUTE: ${SLACK_DIGEST_CRONTAB_MINUTE:-0}
  SLACK_DIGEST_CRONTAB_HOUR: "${SLACK_DIGEST_CRONTAB_HOUR:-*}"
  SLACK_DIGEST_WINDOW_HOURS: ${SLACK_DIGEST_WINDOW_HOURS:-1}
  SCHEDULED_GEOJSON_INGEST_PATH: ${SCHEDULED_GEOJSON_INGEST_PATH:-}
  SCHEDULED_GEOJSON_INGEST_DEFAULT_COUNTY_FIPS: ${SCHEDULED_GEOJSON_INGEST_DEFAULT_COUNTY_FIPS:-}
  SCHEDULED_GEOJSON_INGEST_AUTO_RUN_PIPELINE: ${SCHEDULED_GEOJSON_INGEST_AUTO_RUN_PIPELINE:-false}
  SCHEDULED_GEOJSON_INGEST_MAX_AUTO_PIPELINE: ${SCHEDULED_GEOJSON_INGEST_MAX_AUTO_PIPELINE:-100}
  SCHEDULED_GEOJSON_INGEST_CRONTAB_HOUR: ${SCHEDULED_GEOJSON_INGEST_CRONTAB_HOUR:-7}
  SCHEDULED_GEOJSON_INGEST_CRONTAB_MINUTE: ${SCHEDULED_GEOJSON_INGEST_CRONTAB_MINUTE:-0}
  SCHEDULED_ENQUEUE_UNSCORED_ENABLED: ${SCHEDULED_ENQUEUE_UNSCORED_ENABLED:-true}
  API_PUBLIC_URL: ${PUBLIC_API_URL:-}
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
  SITE_WATCHDOG_ENABLED: ${SITE_WATCHDOG_ENABLED:-true}
  SITE_WATCHDOG_UI_BASE_URL: ${SITE_WATCHDOG_UI_BASE_URL:-}
  SITE_WATCHDOG_INTERNAL_API_URL: ${SITE_WATCHDOG_INTERNAL_API_URL:-http://api:8000}
  SITE_WATCHDOG_INTERNAL_UI_URL: ${SITE_WATCHDOG_INTERNAL_UI_URL:-http://operator-console:3000}
  SITE_WATCHDOG_RETRY_COUNT: ${SITE_WATCHDOG_RETRY_COUNT:-3}
  SITE_WATCHDOG_RETRY_DELAY_SECONDS: ${SITE_WATCHDOG_RETRY_DELAY_SECONDS:-5}
  SITE_WATCHDOG_SLACK_CHANNEL_ID: ${SITE_WATCHDOG_SLACK_CHANNEL_ID:-}
  SITE_WATCHDOG_PARKING_QUEUE_WARN: ${SITE_WATCHDOG_PARKING_QUEUE_WARN:-50000}
  SITE_WATCHDOG_HEARTBEAT_HOURS: ${SITE_WATCHDOG_HEARTBEAT_HOURS:-1}
  SITE_WATCHDOG_CRONTAB_MINUTE: ${SITE_WATCHDOG_CRONTAB_MINUTE:-0}
  SCHEDULED_ENQUEUE_UNSCORED_LIMIT: ${SCHEDULED_ENQUEUE_UNSCORED_LIMIT:-50}
  SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_MINUTE: ${SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_MINUTE:-25}
  SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_HOUR: "${SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_HOUR:-*/12}"
  SCHEDULED_REFRESH_IDENTIFICATION_ENABLED: ${SCHEDULED_REFRESH_IDENTIFICATION_ENABLED:-false}
  SCHEDULED_REFRESH_IDENTIFICATION_LIMIT: ${SCHEDULED_REFRESH_IDENTIFICATION_LIMIT:-2000}
  SCHEDULED_REFRESH_IDENTIFICATION_CRONTAB_MINUTE: ${SCHEDULED_REFRESH_IDENTIFICATION_CRONTAB_MINUTE:-10}
  SCHEDULED_REFRESH_IDENTIFICATION_CRONTAB_HOUR: "${SCHEDULED_REFRESH_IDENTIFICATION_CRONTAB_HOUR:-*/6}"
  SCHEDULED_REFRESH_IDENTIFICATION_COUNTY_FIPS: ${SCHEDULED_REFRESH_IDENTIFICATION_COUNTY_FIPS:-}
  POI_OVERPASS_URL: ${POI_OVERPASS_URL:-https://overpass.openstreetmap.fr/api/interpreter}
  POI_OVERPASS_DELAY_SEC: ${POI_OVERPASS_DELAY_SEC:-1.1}
  POI_OVERPASS_USER_AGENT: "${POI_OVERPASS_USER_AGENT:-parkinglot-pilot/1.0 (commercial POI density; contact: ops@vspecialist.com)}"
  SCHEDULED_REFRESH_DEMAND_ENABLED: ${SCHEDULED_REFRESH_DEMAND_ENABLED:-false}
  SCHEDULED_REFRESH_DEMAND_LIMIT: ${SCHEDULED_REFRESH_DEMAND_LIMIT:-2000}
  SCHEDULED_REFRESH_DEMAND_CRONTAB_MINUTE: ${SCHEDULED_REFRESH_DEMAND_CRONTAB_MINUTE:-40}
  SCHEDULED_REFRESH_DEMAND_CRONTAB_HOUR: "${SCHEDULED_REFRESH_DEMAND_CRONTAB_HOUR:-*/6}"
  SCHEDULED_REFRESH_DEMAND_COUNTY_FIPS: ${SCHEDULED_REFRESH_DEMAND_COUNTY_FIPS:-}
  EXPLORATION_CAMPAIGN_ENABLED: ${EXPLORATION_CAMPAIGN_ENABLED:-false}
  EXPLORATION_CAMPAIGN_CONFIG_PATH: ${EXPLORATION_CAMPAIGN_CONFIG_PATH:-/app/config/exploration_campaign_wa.yaml}
  EXPLORATION_CAMPAIGN_CRONTAB_HOUR: ${EXPLORATION_CAMPAIGN_CRONTAB_HOUR:-6}
  EXPLORATION_CAMPAIGN_CRONTAB_MINUTE: ${EXPLORATION_CAMPAIGN_CRONTAB_MINUTE:-30}
  EXPLORATION_CAMPAIGN_START_DATE: ${EXPLORATION_CAMPAIGN_START_DATE:-}
  WA_STATEWIDE_ROLLOUT_ENABLED: ${WA_STATEWIDE_ROLLOUT_ENABLED:-false}
  WA_STATEWIDE_ROLLOUT_CONFIG_PATH: ${WA_STATEWIDE_ROLLOUT_CONFIG_PATH:-/app/config/wa_statewide_rollout.yaml}
  WA_STATEWIDE_ROLLOUT_CRONTAB_HOUR: ${WA_STATEWIDE_ROLLOUT_CRONTAB_HOUR:-7}
  WA_STATEWIDE_ROLLOUT_CRONTAB_MINUTE: ${WA_STATEWIDE_ROLLOUT_CRONTAB_MINUTE:-15}
  SCHEDULED_PRIORITY_PIPELINE_ENABLED: ${SCHEDULED_PRIORITY_PIPELINE_ENABLED:-false}
  SCHEDULED_PRIORITY_PIPELINE_LIMIT: ${SCHEDULED_PRIORITY_PIPELINE_LIMIT:-75}
  SCHEDULED_PRIORITY_PIPELINE_CRONTAB_HOUR: "${SCHEDULED_PRIORITY_PIPELINE_CRONTAB_HOUR:-*/2}"
  SCHEDULED_PRIORITY_PIPELINE_CRONTAB_MINUTE: ${SCHEDULED_PRIORITY_PIPELINE_CRONTAB_MINUTE:-20}

services:
  redis:
    image: redis:7-alpine
    restart: always
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "512mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  api:
    image: ${API_IMAGE:?Set API_IMAGE to ghcr.io/<owner>/parking-acquisition-api:<tag>}
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      PILOT_CONFIG_PATH: /app/config/pilot.yaml
      PILOT_STRATEGIC_CONFIG_PATH: /app/config/pilot_strategic.yaml
      PILOT_IDENTIFICATION_CONFIG_PATH: /app/config/pilot_identification.yaml
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_REGION: ${STORAGE_REGION}
      ZONING_RULES_PATH: ${ZONING_RULES_PATH:-}
      API_PUBLIC_URL: ${PUBLIC_API_URL}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_DIGEST_CHANNEL_ID: ${SLACK_DIGEST_CHANNEL_ID:-}
      SLACK_AGENT_DISCUSSION_CHANNEL_ID: ${SLACK_AGENT_DISCUSSION_CHANNEL_ID:-}
      SLACK_AGENT_EVENT_UPDATES: ${SLACK_AGENT_EVENT_UPDATES:-}
      SCHEDULED_GEOJSON_INGEST_PATH: ${SCHEDULED_GEOJSON_INGEST_PATH:-}
      SCHEDULED_GEOJSON_INGEST_DEFAULT_COUNTY_FIPS: ${SCHEDULED_GEOJSON_INGEST_DEFAULT_COUNTY_FIPS:-}
      SCHEDULED_GEOJSON_INGEST_AUTO_RUN_PIPELINE: ${SCHEDULED_GEOJSON_INGEST_AUTO_RUN_PIPELINE:-false}
      SCHEDULED_GEOJSON_INGEST_MAX_AUTO_PIPELINE: ${SCHEDULED_GEOJSON_INGEST_MAX_AUTO_PIPELINE:-100}
      SCHEDULED_GEOJSON_INGEST_CRONTAB_HOUR: ${SCHEDULED_GEOJSON_INGEST_CRONTAB_HOUR:-7}
      SCHEDULED_GEOJSON_INGEST_CRONTAB_MINUTE: ${SCHEDULED_GEOJSON_INGEST_CRONTAB_MINUTE:-0}
      SCHEDULED_ENQUEUE_UNSCORED_ENABLED: ${SCHEDULED_ENQUEUE_UNSCORED_ENABLED:-true}
      SITE_WATCHDOG_ENABLED: ${SITE_WATCHDOG_ENABLED:-true}
      SITE_WATCHDOG_UI_BASE_URL: ${SITE_WATCHDOG_UI_BASE_URL:-}
      SITE_WATCHDOG_SLACK_CHANNEL_ID: ${SITE_WATCHDOG_SLACK_CHANNEL_ID:-}
      SITE_WATCHDOG_PARKING_QUEUE_WARN: ${SITE_WATCHDOG_PARKING_QUEUE_WARN:-50000}
      SITE_WATCHDOG_HEARTBEAT_HOURS: ${SITE_WATCHDOG_HEARTBEAT_HOURS:-1}
      SITE_WATCHDOG_CRONTAB_MINUTE: ${SITE_WATCHDOG_CRONTAB_MINUTE:-0}
      SCHEDULED_ENQUEUE_UNSCORED_LIMIT: ${SCHEDULED_ENQUEUE_UNSCORED_LIMIT:-50}
      SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_MINUTE: ${SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_MINUTE:-25}
      SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_HOUR: "${SCHEDULED_ENQUEUE_UNSCORED_CRONTAB_HOUR:-*/12}"
      SCHEDULED_REFRESH_IDENTIFICATION_ENABLED: ${SCHEDULED_REFRESH_IDENTIFICATION_ENABLED:-false}
      SCHEDULED_REFRESH_IDENTIFICATION_LIMIT: ${SCHEDULED_REFRESH_IDENTIFICATION_LIMIT:-2000}
      SCHEDULED_REFRESH_IDENTIFICATION_CRONTAB_MINUTE: ${SCHEDULED_REFRESH_IDENTIFICATION_CRONTAB_MINUTE:-10}
      SCHEDULED_REFRESH_IDENTIFICATION_CRONTAB_HOUR: "${SCHEDULED_REFRESH_IDENTIFICATION_CRONTAB_HOUR:-*/6}"
      SCHEDULED_REFRESH_IDENTIFICATION_COUNTY_FIPS: ${SCHEDULED_REFRESH_IDENTIFICATION_COUNTY_FIPS:-}
      SCHEDULED_REFRESH_DEMAND_ENABLED: ${SCHEDULED_REFRESH_DEMAND_ENABLED:-false}
      SCHEDULED_REFRESH_DEMAND_LIMIT: ${SCHEDULED_REFRESH_DEMAND_LIMIT:-2000}
      SCHEDULED_REFRESH_DEMAND_CRONTAB_MINUTE: ${SCHEDULED_REFRESH_DEMAND_CRONTAB_MINUTE:-40}
      SCHEDULED_REFRESH_DEMAND_CRONTAB_HOUR: "${SCHEDULED_REFRESH_DEMAND_CRONTAB_HOUR:-*/6}"
      SCHEDULED_REFRESH_DEMAND_COUNTY_FIPS: ${SCHEDULED_REFRESH_DEMAND_COUNTY_FIPS:-}
      POI_OVERPASS_URL: ${POI_OVERPASS_URL:-https://overpass.openstreetmap.fr/api/interpreter}
      POI_OVERPASS_DELAY_SEC: ${POI_OVERPASS_DELAY_SEC:-1.1}
      POI_OVERPASS_USER_AGENT: "${POI_OVERPASS_USER_AGENT:-parkinglot-pilot/1.0 (commercial POI density; contact: ops@vspecialist.com)}"
      EXPLORATION_CAMPAIGN_ENABLED: ${EXPLORATION_CAMPAIGN_ENABLED:-false}
      EXPLORATION_CAMPAIGN_CONFIG_PATH: ${EXPLORATION_CAMPAIGN_CONFIG_PATH:-/app/config/exploration_campaign_wa.yaml}
      EXPLORATION_CAMPAIGN_CRONTAB_HOUR: ${EXPLORATION_CAMPAIGN_CRONTAB_HOUR:-6}
      EXPLORATION_CAMPAIGN_CRONTAB_MINUTE: ${EXPLORATION_CAMPAIGN_CRONTAB_MINUTE:-30}
      EXPLORATION_CAMPAIGN_START_DATE: ${EXPLORATION_CAMPAIGN_START_DATE:-}
      LOB_API_KEY: ${LOB_API_KEY:-}
      LOB_FROM_NAME: ${LOB_FROM_NAME:-}
      LOB_FROM_ADDRESS_LINE1: ${LOB_FROM_ADDRESS_LINE1:-}
      LOB_FROM_ADDRESS_LINE2: ${LOB_FROM_ADDRESS_LINE2:-}
      LOB_FROM_ADDRESS_CITY: ${LOB_FROM_ADDRESS_CITY:-}
      LOB_FROM_ADDRESS_STATE: ${LOB_FROM_ADDRESS_STATE:-}
      LOB_FROM_ADDRESS_ZIP: ${LOB_FROM_ADDRESS_ZIP:-}
      LOB_MAIL_EXTRA_SERVICE: ${LOB_MAIL_EXTRA_SERVICE:-certified}
      LOB_SEND_ENABLED: ${LOB_SEND_ENABLED:-false}
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data:ro
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

  worker:
    image: ${API_IMAGE:?Set API_IMAGE to the same API/worker image as the api service}
    restart: always
    command: *worker-parking-cmd
    environment:
      <<: *worker-beat-env
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    logging: *default-logging

  worker-slack:
    image: ${API_IMAGE:?Same image as worker — dedicated Slack digest queue}
    restart: always
    command: *worker-slack-cmd
    environment:
      <<: *worker-beat-env
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    logging: *default-logging

  beat:
    image: ${API_IMAGE:?Same image as worker (API image bundles Celery app)}
    restart: always
    command: ["celery", "-A", "app.celery_app", "beat", "-l", "INFO"]
    environment:
      <<: *worker-beat-env
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    logging: *default-logging

  approval-ui:
    build:
      context: ..
      dockerfile: apps/approval-ui/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    restart: always
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
      API_SERVER_URL: http://api:8000
    expose:
      - "3000"
    depends_on:
      - api
    logging: *default-logging

  operator-console:
    build:
      context: ..
      dockerfile: apps/operator-console/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    restart: always
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
      API_SERVER_URL: http://api:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_started
    logging: *default-logging

  caddy:
    image: caddy:2.8-alpine
    restart: always
    ports:
      - "${CADDY_PUBLISH_HTTP:-80}:80"
      - "${CADDY_PUBLISH_HTTPS:-443}:443"
    environment:
      UI_HOST: ${UI_HOST}
      API_HOST: ${API_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deploy/.env for Let's Encrypt}
    volumes:
      - ${CADDY_CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - approval-ui
      - operator-console
    logging: *default-logging

volumes:
  redis_data:
  caddy_data:
  caddy_config:
