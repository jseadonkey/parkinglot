# Same as docker-compose.production.yml but API + worker use a pre-built image from GHCR
# (no compile on the Droplet). Build/push images via .github/workflows/container-images.yml.
#
# deploy/.env must set API_IMAGE, e.g.:
#   API_IMAGE=ghcr.io/yourgithubuser/parking-acquisition-api:latest
#
# On the Droplet (once): echo $GHCR_TOKEN | docker login ghcr.io -u USERNAME --password-stdin
# Use a GitHub PAT with read:packages (fine-grained: read access to packages).
#
# From repo root:
#   docker compose -f deploy/docker-compose.production.ghcr.yml --env-file deploy/.env pull
#   docker compose -f deploy/docker-compose.production.ghcr.yml --env-file deploy/.env up -d

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-worker-beat-env: &worker-beat-env
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
  PILOT_CONFIG_PATH: /app/config/pilot.yaml
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
  STORAGE_BUCKET: ${STORAGE_BUCKET}
  STORAGE_REGION: ${STORAGE_REGION}
  SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
  SLACK_DIGEST_CHANNEL_ID: ${SLACK_DIGEST_CHANNEL_ID:-}

services:
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  api:
    image: ${API_IMAGE:?Set API_IMAGE to ghcr.io/<owner>/parking-acquisition-api:<tag>}
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      PILOT_CONFIG_PATH: /app/config/pilot.yaml
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_REGION: ${STORAGE_REGION}
      API_PUBLIC_URL: ${PUBLIC_API_URL}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data:ro
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

  worker:
    image: ${API_IMAGE:?Set API_IMAGE to the same API/worker image as the api service}
    restart: always
    command: ["celery", "-A", "app.celery_app", "worker", "-l", "INFO", "--concurrency=2"]
    environment:
      <<: *worker-beat-env
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data:ro
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

  beat:
    image: ${API_IMAGE:?Same image as worker (API image bundles Celery app)}
    restart: always
    command: ["celery", "-A", "app.celery_app", "beat", "-l", "INFO"]
    environment:
      <<: *worker-beat-env
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data:ro
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

  approval-ui:
    build:
      context: ..
      dockerfile: apps/approval-ui/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    expose:
      - "3000"
    depends_on:
      - api
    logging: *default-logging

  caddy:
    image: caddy:2.8-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      UI_HOST: ${UI_HOST}
      API_HOST: ${API_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deploy/.env for Let's Encrypt}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - approval-ui
    logging: *default-logging

volumes:
  redis_data:
  caddy_data:
  caddy_config:
