# One-off remediation for the 2026-06-09 DB/API incident.
# Runs only on this agent branch and recreates API-backed services from the GHCR compose file.

name: DB CPU incident remediate

on:
  push:
    branches:
      - cursor/db-cpu-diagnostics-d384
    paths:
      - .github/workflows/db-cpu-incident-remediate.yml

permissions:
  contents: read

jobs:
  restore-api-ghcr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}

      - name: Configure SSH known_hosts
        run: |
          install -d -m 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Recreate API services from GHCR compose
        env:
          DROPLET_REMOTE_PATH: ${{ vars.DROPLET_REMOTE_PATH }}
        run: |
          set -euo pipefail
          RAW="${DROPLET_REMOTE_PATH:-/opt/workspaces/parkinglot}"
          REMOTE_PATH="$(printf '%s' "$RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [ -n "$REMOTE_PATH" ] || REMOTE_PATH="/opt/workspaces/parkinglot"
          ssh -oBatchMode=yes "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "cd $(printf '%q' "$REMOTE_PATH") && bash -s" <<'REMOTE'
          set -euo pipefail
          COMPOSE_REL="deploy/docker-compose.production.ghcr.yml"
          test -f "$COMPOSE_REL"
          test -f deploy/.env
          ARGS=(-f "$COMPOSE_REL" --env-file deploy/.env)

          echo "=== before ==="
          docker compose "${ARGS[@]}" ps api worker worker-slack beat redis caddy

          echo "=== pull GHCR API image where configured ==="
          docker compose "${ARGS[@]}" pull api worker worker-slack beat || true

          echo "=== recreate API-backed services ==="
          docker compose "${ARGS[@]}" up -d --no-deps api worker worker-slack beat

          echo "=== wait for API health ==="
          for i in $(seq 1 30); do
            sleep 2
            if docker compose "${ARGS[@]}" exec -T api python - <<'PY'; then
          import urllib.request
          with urllib.request.urlopen("http://127.0.0.1:8000/ready", timeout=5) as resp:
              print(resp.status, resp.read().decode()[:300])
          PY
              break
            fi
            echo "api not ready yet ($i/30)"
          done

          echo "=== after ==="
          docker compose "${ARGS[@]}" ps api worker worker-slack beat redis caddy

          echo "=== recent api logs ==="
          docker compose "${ARGS[@]}" logs --no-color --tail 100 api

          echo "=== external ready ==="
          curl -fsSk --connect-timeout 10 --max-time 30 https://api.vspecialist.com/ready
          REMOTE
