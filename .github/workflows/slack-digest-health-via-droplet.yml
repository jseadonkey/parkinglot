# Fails if no recent successful Slack digest audit (Beat → worker → Slack → audit_log).
#
# Requires: DROPLET_HOST, DROPLET_USER, DROPLET_SSH_PRIVATE_KEY
# Optional: SLACK_DEPLOY_NOTIFY_INTERNAL_API_KEY (same as INTERNAL_API_KEY on the Droplet)
# Optional: DROPLET_REMOTE_PATH (repo var), MAX_DIGEST_AGE_HOURS.
# When MAX_DIGEST_AGE_HOURS is unset, the check derives a threshold from the
# Droplet's SLACK_DIGEST_CRONTAB_* cadence; hourly default still fails after
# roughly two missed cycles.
#
# Remove the `schedule` block if you only want manual runs.

name: Slack digest health (via Droplet)

on:
  schedule:
    - cron: "25 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}

      - name: Configure SSH known_hosts
        run: |
          install -d -m 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify last digest audit is fresh
        env:
          DROPLET_REMOTE_PATH: ${{ vars.DROPLET_REMOTE_PATH }}
          SLACK_DEPLOY_NOTIFY_INTERNAL_API_KEY: ${{ secrets.SLACK_DEPLOY_NOTIFY_INTERNAL_API_KEY }}
          MAX_DIGEST_AGE_HOURS: ${{ vars.MAX_DIGEST_AGE_HOURS }}
        run: |
          set -euo pipefail
          RAW="${DROPLET_REMOTE_PATH:-/opt/parking-acquisition-agents}"
          REMOTE_PATH="$(printf '%s' "$RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [ -n "$REMOTE_PATH" ] || REMOTE_PATH="/opt/parking-acquisition-agents"
          KEY="${SLACK_DEPLOY_NOTIFY_INTERNAL_API_KEY:-}"
          MAX_H="${MAX_DIGEST_AGE_HOURS:-}"

          PAYLOAD="$(cat .github/workflows/scripts/droplet-remote-checks.sh | ssh -oBatchMode=yes \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "cd $(printf '%q' "$REMOTE_PATH") && bash -s -- last-digest")"
          SCHEDULE="$(cat .github/workflows/scripts/droplet-remote-checks.sh | ssh -oBatchMode=yes \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "cd $(printf '%q' "$REMOTE_PATH") && bash -s -- slack-digest-cadence")"

          export MAX_H="$MAX_H"
          export PAYLOAD
          export SCHEDULE
          python3 <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timedelta, timezone
          from typing import Iterable

          def _expand_cron_hours(expr: str) -> list[int]:
              expr = (expr or "*").strip().strip('"').strip("'")
              if not expr or expr == "*":
                  return list(range(24))
              out: set[int] = set()
              for part in expr.split(","):
                  part = part.strip()
                  if not part:
                      continue
                  step = 1
                  if "/" in part:
                      base, raw_step = part.split("/", 1)
                      step = max(1, int(raw_step))
                  else:
                      base = part
                  if base in ("", "*"):
                      start, end = 0, 23
                  elif "-" in base:
                      raw_start, raw_end = base.split("-", 1)
                      start, end = int(raw_start), int(raw_end)
                  else:
                      start = end = int(base)
                  if start < 0 or end > 23 or start > end:
                      raise ValueError(f"unsupported hour range: {part!r}")
                  out.update(range(start, end + 1, step))
              if not out:
                  raise ValueError(f"empty hour schedule: {expr!r}")
              return sorted(out)

          def _max_gap_hours(hours: Iterable[int]) -> float:
              ordered = sorted(set(hours))
              gaps = [b - a for a, b in zip(ordered, ordered[1:])]
              gaps.append(24 - ordered[-1] + ordered[0])
              return float(max(gaps))

          def _freshness_threshold_hours() -> tuple[float, str]:
              override = (os.environ.get("MAX_H") or "").strip()
              if override:
                  return float(override), "MAX_DIGEST_AGE_HOURS"
              raw_schedule = (os.environ.get("SCHEDULE") or "").strip()
              try:
                  schedule = json.loads(raw_schedule) if raw_schedule else {}
                  hours = _expand_cron_hours(str(schedule.get("hour") or "*"))
                  gap_h = _max_gap_hours(hours)
              except Exception as exc:
                  print(f"WARN: could not parse Slack digest cadence ({exc}); using 3h default.")
                  return 3.0, "fallback"
              # Allow schedule jitter and GitHub Actions start delays while still
              # failing after the next expected digest is missed.
              return max(3.0, gap_h + 2.0), f"cadence:{schedule.get('hour') or '*'}"

          max_h, max_source = _freshness_threshold_hours()
          raw = (os.environ.get("PAYLOAD") or "").strip()
          if not raw:
              print("FAIL: empty response from GET /internal/slack/last-digest (curl or SSH failed).")
              sys.exit(1)
          try:
              data = json.loads(raw)
          except json.JSONDecodeError:
              print("FAIL: non-JSON from last-digest (first 200 chars):", raw[:200])
              sys.exit(1)
          if not data.get("found"):
              err = data.get("error", "")
              if err:
                  print(f"FAIL: last-digest unreachable from Droplet ({err}).")
              else:
                  print("FAIL: no slack_digest_posted audit yet (worker may never have posted to Slack).")
              sys.exit(1)
          raw = data["created_at"]
          if raw.endswith("Z"):
              raw = raw[:-1] + "+00:00"
          ts = datetime.fromisoformat(raw)
          if ts.tzinfo is None:
              ts = ts.replace(tzinfo=timezone.utc)
          age = datetime.now(timezone.utc) - ts
          if age > timedelta(hours=max_h):
              print(f"FAIL: last digest audit stale (age={age}, max={max_h}h, source={max_source}).")
              sys.exit(1)
          print(f"OK: last digest audit age={age}, max={max_h}h, source={max_source}")
          PY
