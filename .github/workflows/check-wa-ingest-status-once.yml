name: Check WA ingest status once

on:
  push:
    branches:
      - cursor/wa-zoning-followup-9516
    paths:
      - ".github/workflows/check-wa-ingest-status-once.yml"
  workflow_dispatch:
    inputs:
      task_id:
        description: "Celery task id to inspect"
        type: string
        default: "70ba0f36-2cec-49ef-9c5d-2d5f92c84663"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}

      - name: Configure SSH known_hosts
        run: |
          install -d -m 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Check task and rollout status
        env:
          DROPLET_REMOTE_PATH: ${{ vars.DROPLET_REMOTE_PATH }}
          TASK_ID: ${{ github.event.inputs.task_id || '70ba0f36-2cec-49ef-9c5d-2d5f92c84663' }}
        run: |
          set -euo pipefail
          RAW="${DROPLET_REMOTE_PATH:-/opt/workspaces/parkinglot}"
          REMOTE_PATH="$(printf '%s' "$RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [ -n "$REMOTE_PATH" ] || REMOTE_PATH="/opt/workspaces/parkinglot"
          ssh -oBatchMode=yes "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "cd $(printf '%q' "$REMOTE_PATH") && docker compose -f deploy/docker-compose.production.ghcr.yml --env-file deploy/.env exec -T -e TASK_ID=$(printf '%q' "$TASK_ID") api python - <<'PY'
          import json
          import os
          import urllib.request

          key = os.environ.get('INTERNAL_API_KEY', '')
          task_id = os.environ['TASK_ID']
          headers = {'Accept': 'application/json'}
          if key:
              headers['X-Internal-Key'] = key

          for path in (f'/internal/tasks/{task_id}', '/internal/ingest/wa-rollout-status'):
              req = urllib.request.Request(f'http://127.0.0.1:8000{path}', headers=headers)
              with urllib.request.urlopen(req, timeout=60) as resp:
                  body = json.loads(resp.read().decode())
              print(f'=== {path} ===')
              print(json.dumps(body, indent=2))
          PY"
