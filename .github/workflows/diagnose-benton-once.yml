name: Diagnose Benton once

on:
  push:
    branches:
      - cursor/wa-zoning-followup-9516
    paths:
      - ".github/workflows/diagnose-benton-once.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}

      - name: Configure SSH known_hosts
        run: |
          install -d -m 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Diagnose Benton ingest
        env:
          DROPLET_REMOTE_PATH: ${{ vars.DROPLET_REMOTE_PATH }}
        run: |
          set -euo pipefail
          RAW="${DROPLET_REMOTE_PATH:-/opt/workspaces/parkinglot}"
          REMOTE_PATH="$(printf '%s' "$RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [ -n "$REMOTE_PATH" ] || REMOTE_PATH="/opt/workspaces/parkinglot"
          ssh -oBatchMode=yes "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "cd $(printf '%q' "$REMOTE_PATH") && bash -s" <<'EOS'
          set -euo pipefail
          COMPOSE=(docker compose -f deploy/docker-compose.production.yml --env-file deploy/.env)

          echo "=== rollout status ==="
          KEY="$(grep -E '^INTERNAL_API_KEY=' deploy/.env | head -1 | cut -d= -f2- | tr -d '\r' | sed 's/^"//;s/"$//')"
          "${COMPOSE[@]}" exec -T -e INTERNAL_API_KEY="$KEY" api python - <<'PY'
          import json
          import os
          import urllib.request

          headers = {"Accept": "application/json"}
          key = os.environ.get("INTERNAL_API_KEY", "")
          if key:
              headers["X-Internal-Key"] = key
          for path in ("/internal/ingest/wa-rollout-status",):
              req = urllib.request.Request(f"http://127.0.0.1:8000{path}", headers=headers)
              with urllib.request.urlopen(req, timeout=60) as resp:
                  print(json.dumps(json.loads(resp.read().decode()), indent=2))
          PY

          echo "=== recent WA rollout audits ==="
          "${COMPOSE[@]}" exec -T api python - <<'PY'
          import json
          from sqlalchemy import select
          from app.db.models import AuditLog
          from app.db.session import SessionLocal

          with SessionLocal() as db:
              rows = db.execute(
                  select(AuditLog)
                  .where(AuditLog.action.in_(["wa_statewide_county_ingest", "parcels_ingested", "wa_zoning_followup_required"]))
                  .order_by(AuditLog.created_at.desc())
                  .limit(25)
              ).scalars().all()
          for row in rows:
              meta = row.meta or {}
              if row.entity_id == "53005" or meta.get("default_county_fips") == "53005" or meta.get("county_touches", {}).get("53005"):
                  print(row.created_at.isoformat(), row.action, row.entity_type, row.entity_id, json.dumps(meta)[:1200])
          PY

          echo "=== celery inspect ==="
          "${COMPOSE[@]}" exec -T worker celery -A app.celery_app inspect active --timeout=5 || true
          "${COMPOSE[@]}" exec -T worker celery -A app.celery_app inspect reserved --timeout=5 || true

          echo "=== recent worker/beat logs for Benton/WaTech ==="
          "${COMPOSE[@]}" logs --since 16h worker beat 2>&1 \
            | grep -Ei '53005|Benton|watech|wa_statewide|fetch_watech|ingest_geojson|no features|warning|error|failed|succeeded' \
            | tail -240 || true
          EOS
