# Post a test message to Slack by calling the API on your Droplet (no deploy).
#
# Requires repository secrets (same as Deploy to Droplet):
#   DROPLET_HOST, DROPLET_USER, DROPLET_SSH_PRIVATE_KEY
# Optional variable: DROPLET_REMOTE_PATH (default /opt/workspaces/parkinglot)
#
# Uses deploy/.env SLACK_* on the server — no GitHub Slack secrets required.

name: Slack test (via Droplet)

on:
  workflow_dispatch:
    inputs:
      message_text:
        description: "Plain text to post (max 2000). Empty = default GitHub Actions test line."
        type: string
        default: ""
      channel_id:
        description: "Optional Slack channel ID (C…). Empty uses SLACK_DIGEST_CHANNEL_ID from deploy/.env"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}

      - name: Configure SSH known_hosts
        run: |
          install -d -m 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Post test message via Droplet
        env:
          DROPLET_REMOTE_PATH: ${{ vars.DROPLET_REMOTE_PATH }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          REF="${{ github.ref_name }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DEFAULT_MSG="Slack test from GitHub Actions: ${REPO} (${REF}) — ${RUN_URL}"
          TEXT_INPUT="${{ inputs.message_text }}"
          if [ -n "$TEXT_INPUT" ]; then NOTIFY_TEXT="$TEXT_INPUT"; else NOTIFY_TEXT="$DEFAULT_MSG"; fi
          NOTIFY_CHANNEL="${{ inputs.channel_id }}"
          RAW="${DROPLET_REMOTE_PATH:-/opt/workspaces/parkinglot}"
          REMOTE_PATH="$(printf '%s' "$RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [ -n "$REMOTE_PATH" ] || REMOTE_PATH="/opt/workspaces/parkinglot"
          B64="$(printf '%s' "$NOTIFY_TEXT" | base64 | tr -d '\n')"
          cat .github/workflows/scripts/droplet-remote-checks.sh | ssh -oBatchMode=yes \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "cd $(printf '%q' "$REMOTE_PATH") && NOTIFY_TEXT=\$(printf '%s' '$B64' | base64 -d) NOTIFY_CHANNEL=$(printf '%q' "$NOTIFY_CHANNEL") bash -s -- post-slack-text deploy/docker-compose.production.ghcr.yml"
