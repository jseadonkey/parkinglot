# Post a test message to Slack by calling the API on your Droplet (no deploy).
#
# Requires repository secrets (same as Deploy to Droplet):
#   DROPLET_HOST, DROPLET_USER, DROPLET_SSH_PRIVATE_KEY
# Optional: SLACK_DEPLOY_NOTIFY_INTERNAL_API_KEY — same as INTERNAL_API_KEY on the Droplet
# Optional variable: DROPLET_REMOTE_PATH (default /opt/parking-acquisition-agents)
#
# The Droplet must have deploy/.env with SLACK_* configured and a reachable PUBLIC_API_URL (or API_HOST).

name: Slack test (via Droplet)

on:
  workflow_dispatch:
    inputs:
      message_text:
        description: "Plain text to post (max 2000). Empty = default GitHub Actions test line."
        type: string
        default: ""
      channel_id:
        description: "Optional Slack channel ID (C…). Empty uses SLACK_DIGEST_CHANNEL_ID from deploy/.env"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}

      - name: Configure SSH known_hosts
        run: |
          install -d -m 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: POST /internal/slack/test-message from Droplet
        env:
          DROPLET_REMOTE_PATH: ${{ vars.DROPLET_REMOTE_PATH }}
          SLACK_DEPLOY_NOTIFY_INTERNAL_API_KEY: ${{ secrets.SLACK_DEPLOY_NOTIFY_INTERNAL_API_KEY }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          REF="${{ github.ref_name }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DEFAULT_MSG="Slack test from GitHub Actions: ${REPO} (${REF}) — ${RUN_URL}"
          TEXT_INPUT="${{ inputs.message_text }}"
          if [ -n "$TEXT_INPUT" ]; then NOTIFY_TEXT="$TEXT_INPUT"; else NOTIFY_TEXT="$DEFAULT_MSG"; fi
          export NOTIFY_TEXT
          export NOTIFY_CHANNEL_ID="${{ inputs.channel_id }}"
          PAYLOAD_JSON=$(python3 <<'PY'
          import json
          import os

          body = {"text": os.environ["NOTIFY_TEXT"]}
          cid = (os.environ.get("NOTIFY_CHANNEL_ID") or "").strip()
          if cid:
              body["channel_id"] = cid
          print(json.dumps(body))
          PY
          )
          REMOTE_PATH="${DROPLET_REMOTE_PATH:-/opt/parking-acquisition-agents}"
          KEY="${SLACK_DEPLOY_NOTIFY_INTERNAL_API_KEY:-}"
          export PAYLOAD_JSON
          export KEY
          ssh -oBatchMode=yes "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "env REMOTE_PATH=$(printf '%q' "$REMOTE_PATH") PAYLOAD_JSON=$(printf '%q' "$PAYLOAD_JSON") KEY=$(printf '%q' "$KEY") bash -s" <<'EOS'
          set -euo pipefail
          cd "$REMOTE_PATH"
          test -f deploy/.env
          BASE=$(grep -E '^PUBLIC_API_URL=' deploy/.env | head -1 | cut -d= -f2- | tr -d '\r' | sed 's/^"//;s/"$//')
          if [ -z "$BASE" ]; then
            H=$(grep -E '^API_HOST=' deploy/.env | head -1 | cut -d= -f2- | tr -d '\r' | sed 's/^"//;s/"$//')
            BASE="https://$H"
          fi
          echo "POST $BASE/internal/slack/test-message"
          if [ -n "$KEY" ]; then
            curl -fsS --connect-timeout 15 --max-time 60 -X POST "$BASE/internal/slack/test-message" \
              -H "Content-Type: application/json" \
              -H "X-Internal-Key: $KEY" \
              -d "$PAYLOAD_JSON"
          else
            curl -fsS --connect-timeout 15 --max-time 60 -X POST "$BASE/internal/slack/test-message" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD_JSON"
          fi
          echo
          EOS
