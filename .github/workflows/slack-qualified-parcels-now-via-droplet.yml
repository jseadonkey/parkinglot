# Enqueue the qualified-parcels Slack report (same task Celery Beat runs daily).
#
# Requires: DROPLET_HOST, DROPLET_USER, DROPLET_SSH_PRIVATE_KEY
# Optional: SLACK_DEPLOY_NOTIFY_INTERNAL_API_KEY — same as INTERNAL_API_KEY on the Droplet
# Optional: DROPLET_REMOTE_PATH

name: Slack qualified parcels now (via Droplet)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enqueue:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}

      - name: Configure SSH known_hosts
        run: |
          install -d -m 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Validate parkinglot droplet target
        run: |
          if [ "${{ secrets.DROPLET_HOST }}" != "209.38.142.108" ]; then
            echo "error: this workflow is locked to parkinglot (209.38.142.108); DROPLET_HOST points elsewhere" >&2
            exit 1
          fi

      - name: POST /internal/slack/qualified-parcels-now from Droplet
        env:
          DROPLET_REMOTE_PATH: ${{ vars.DROPLET_REMOTE_PATH }}
          SLACK_DEPLOY_NOTIFY_INTERNAL_API_KEY: ${{ secrets.SLACK_DEPLOY_NOTIFY_INTERNAL_API_KEY }}
        run: |
          set -euo pipefail
          REMOTE_PATH="${DROPLET_REMOTE_PATH:-/opt/workspaces/parkinglot}"
          KEY="${SLACK_DEPLOY_NOTIFY_INTERNAL_API_KEY:-}"
          ssh -oBatchMode=yes "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            bash -s -- "$REMOTE_PATH" "$KEY" <<'EOS'
          set -euo pipefail
          REMOTE_PATH="$1"
          KEY="${2:-}"

          cd "$REMOTE_PATH"
          test -f deploy/.env
          BASE=$(grep -E '^PUBLIC_API_URL=' deploy/.env | head -1 | cut -d= -f2- | tr -d '\r' | sed 's/^"//;s/"$//')
          if [ -z "$BASE" ]; then
            H=$(grep -E '^API_HOST=' deploy/.env | head -1 | cut -d= -f2- | tr -d '\r' | sed 's/^"//;s/"$//')
            BASE="https://$H"
          fi
          echo "POST $BASE/internal/slack/qualified-parcels-now"
          if [ -n "$KEY" ]; then
            curl -fsSk --connect-timeout 15 --max-time 120 -X POST "$BASE/internal/slack/qualified-parcels-now" \
              -H "Content-Type: application/json" \
              -H "X-Internal-Key: $KEY" \
              -d '{}'
          else
            curl -fsSk --connect-timeout 15 --max-time 120 -X POST "$BASE/internal/slack/qualified-parcels-now" \
              -H "Content-Type: application/json" \
              -d '{}'
          fi
          echo
          echo "Poll task: GET $BASE/internal/tasks/<task_id> (same X-Internal-Key if required)."
          EOS
