name: Check Benton live once

on:
  push:
    branches:
      - cursor/wa-zoning-followup-9516
    paths:
      - ".github/workflows/check-benton-live-once.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}

      - name: Configure SSH known_hosts
        run: |
          install -d -m 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Check Benton live status
        env:
          DROPLET_REMOTE_PATH: ${{ vars.DROPLET_REMOTE_PATH }}
        run: |
          set -euo pipefail
          RAW="${DROPLET_REMOTE_PATH:-/opt/workspaces/parkinglot}"
          REMOTE_PATH="$(printf '%s' "$RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [ -n "$REMOTE_PATH" ] || REMOTE_PATH="/opt/workspaces/parkinglot"
          ssh -oBatchMode=yes "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "cd $(printf '%q' "$REMOTE_PATH") && bash -s" <<'EOS'
          set -euo pipefail
          COMPOSE=(docker compose -f deploy/docker-compose.production.yml --env-file deploy/.env)

          echo "=== counts ==="
          "${COMPOSE[@]}" exec -T api python - <<'PY'
          from sqlalchemy import func, select
          from app.db.models import Parcel
          from app.db.session import SessionLocal

          with SessionLocal() as db:
              for fips in ["53005", "53077"]:
                  count = db.scalar(select(func.count()).select_from(Parcel).where(Parcel.county_fips == fips)) or 0
                  print(f"{fips}={count}")
          PY

          echo "=== redis queues ==="
          printf "parking="
          "${COMPOSE[@]}" exec -T redis redis-cli LLEN parking
          printf "slack="
          "${COMPOSE[@]}" exec -T redis redis-cli LLEN slack

          echo "=== celery active ==="
          "${COMPOSE[@]}" exec -T worker celery -A app.celery_app inspect active --timeout=5 || true
          echo "=== celery reserved ==="
          "${COMPOSE[@]}" exec -T worker celery -A app.celery_app inspect reserved --timeout=5 || true

          echo "=== recent Benton worker logs ==="
          "${COMPOSE[@]}" logs --since 20m worker 2>&1 \
            | grep -Ei '53005|watech|page=|inserted|updated|failed|error|succeeded' \
            | tail -160 || true
          EOS
