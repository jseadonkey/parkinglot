# One-time setup: add repository secret DEPLOY_DATABASE_URL (full postgresql:// URI or DATABASE_URL= line
# from DigitalOcean Connection details / Copy). GitHub encrypts it; nothing goes through chat or paste on the Droplet.
#
# Requires the same secrets as Deploy to Droplet: DROPLET_HOST, DROPLET_USER, DROPLET_SSH_PRIVATE_KEY
# Optional variable DROPLET_REMOTE_PATH (default /opt/parking-acquisition-agents — set to /opt/workspaces/parkinglot if needed)

name: Droplet — set DATABASE_URL from GitHub secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-db-url:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - name: Check secret
        env:
          DEPLOY_DATABASE_URL: ${{ secrets.DEPLOY_DATABASE_URL }}
        run: |
          if [ -z "${DEPLOY_DATABASE_URL:-}" ]; then
            echo "::error::Missing repository secret DEPLOY_DATABASE_URL."
            echo "Add it under Settings → Secrets and variables → Actions → New repository secret."
            echo "Paste your full connection URI from DigitalOcean (postgresql://...) or DATABASE_URL=postgresql+psycopg://..."
            exit 1
          fi

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}

      - name: Configure SSH known_hosts
        run: |
          install -d -m 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sanitize remote path
        run: |
          RAW="${DROPLET_REMOTE_PATH:-/opt/parking-acquisition-agents}"
          CLEAN="$(printf '%s' "$RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [ -n "$CLEAN" ] || CLEAN="/opt/parking-acquisition-agents"
          echo "DEPLOY_REMOTE_PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "Using DEPLOY_REMOTE_PATH=$CLEAN"
        env:
          DROPLET_REMOTE_PATH: ${{ vars.DROPLET_REMOTE_PATH }}

      - name: Upload merge helpers and apply DATABASE_URL
        env:
          DEPLOY_DATABASE_URL: ${{ secrets.DEPLOY_DATABASE_URL }}
        run: |
          set -euo pipefail
          REMOTE_PATH="${DEPLOY_REMOTE_PATH:-/opt/parking-acquisition-agents}"
          USER_HOST="${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}"
          RID="${GITHUB_RUN_ID:-run}-${GITHUB_RUN_ATTEMPT:-1}-$$"
          TMP="$(mktemp)"
          chmod 600 "$TMP"
          printf '%s' "${DEPLOY_DATABASE_URL}" > "$TMP"
          scp -oBatchMode=yes scripts/db_url_merge.py scripts/merge_database_url_into_deploy_env.py \
            "${USER_HOST}:${REMOTE_PATH}/scripts/"
          scp -oBatchMode=yes "$TMP" "${USER_HOST}:/tmp/dbmerge.${RID}"
          rm -f "$TMP"
          ssh -oBatchMode=yes "${USER_HOST}" bash -s -- "$REMOTE_PATH" "$RID" <<'EOS'
          set -euo pipefail
          REMOTE_PATH="$1"
          RID="$2"
          REMOTE_FILE="/tmp/dbmerge.${RID}"
          cd "$REMOTE_PATH"
          python3 scripts/merge_database_url_into_deploy_env.py < "$REMOTE_FILE"
          rm -f "$REMOTE_FILE"
          EOS
