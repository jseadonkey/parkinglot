# Post to #gf-parkinglot-agents-chat when CI or Deploy fails on main (replaces email-only alerts).
#
# Uses the Droplet's deploy/.env Slack token — no GitHub SLACK_* secrets required.

name: CI failure → Slack

on:
  workflow_run:
    workflows:
      - CI
      - Deploy to Droplet
    types:
      - completed

permissions:
  contents: read

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}

      - name: Configure SSH known_hosts
        run: |
          install -d -m 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Post failure summary to Slack
        env:
          DROPLET_REMOTE_PATH: ${{ vars.DROPLET_REMOTE_PATH }}
        run: |
          set -euo pipefail
          RAW="${DROPLET_REMOTE_PATH:-/opt/parking-acquisition-agents}"
          REMOTE_PATH="$(printf '%s' "$RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [ -n "$REMOTE_PATH" ] || REMOTE_PATH="/opt/parking-acquisition-agents"
          WF="${{ github.event.workflow_run.name }}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          SHA_SHORT="${SHA:0:7}"
          RUN_URL="${{ github.event.workflow_run.html_url }}"
          MSG=":x: *GitHub ${WF} failed* on \`main\` (\`${SHA_SHORT}\`)\n<${RUN_URL}|View workflow run>"
          B64="$(printf '%s' "$MSG" | base64 | tr -d '\n')"
          cat .github/workflows/scripts/droplet-remote-checks.sh | ssh -oBatchMode=yes \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "cd $(printf '%q' "$REMOTE_PATH") && NOTIFY_TEXT=\$(printf '%s' '$B64' | base64 -d) bash -s -- post-slack-text deploy/docker-compose.production.ghcr.yml"
