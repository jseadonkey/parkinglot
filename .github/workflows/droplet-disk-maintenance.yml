# Weekly Droplet disk maintenance + optional aggressive prune when disk is full.
#
# Complements site-watchdog (alerts) and droplet-cleanup-isolate (manual heavy reset).
# Requires: DROPLET_HOST, DROPLET_USER, DROPLET_SSH_PRIVATE_KEY
# Optional: DROPLET_REMOTE_PATH (repo variable)

name: Droplet disk maintenance

on:
  schedule:
    # Sunday 06:15 UTC — off-peak, after US East late night
    - cron: "15 6 * * 0"
  workflow_dispatch:
    inputs:
      aggressive:
        description: "Prune all unused Docker images (not only dangling)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}

      - name: Configure SSH known_hosts
        run: |
          install -d -m 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run disk maintenance on Droplet
        env:
          DROPLET_REMOTE_PATH: ${{ vars.DROPLET_REMOTE_PATH }}
          DISK_MAINTENANCE_AGGRESSIVE: ${{ inputs.aggressive && '1' || '' }}
        run: |
          set -euo pipefail
          RAW="${DROPLET_REMOTE_PATH:-/opt/parking-acquisition-agents}"
          REMOTE_PATH="$(printf '%s' "$RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [ -n "$REMOTE_PATH" ] || REMOTE_PATH="/opt/parking-acquisition-agents"
          echo "REMOTE_PATH=$REMOTE_PATH"
          cat scripts/remote/droplet-disk-maintenance.sh | ssh -oBatchMode=yes \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "cd $(printf '%q' "$REMOTE_PATH") && DISK_MAINTENANCE_AGGRESSIVE=${DISK_MAINTENANCE_AGGRESSIVE:-} bash -s"
