name: Start WA ingest now

on:
  push:
    branches:
      - cursor/wa-zoning-followup-9516
    paths:
      - ".github/workflows/start-wa-ingest-now.yml"
      - ".github/workflows/scripts/droplet-remote-checks.sh"
  workflow_dispatch:
    inputs:
      county_fips:
        description: "WA county FIPS to ingest now"
        type: string
        default: "53063"

permissions:
  contents: read

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}

      - name: Configure SSH known_hosts
        run: |
          install -d -m 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Start county ingest
        env:
          DROPLET_REMOTE_PATH: ${{ vars.DROPLET_REMOTE_PATH }}
          COUNTY_FIPS: ${{ github.event.inputs.county_fips || '53063' }}
          MAX_AUTO_PIPELINE: "15"
        run: |
          set -euo pipefail
          RAW="${DROPLET_REMOTE_PATH:-/opt/workspaces/parkinglot}"
          REMOTE_PATH="$(printf '%s' "$RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [ -n "$REMOTE_PATH" ] || REMOTE_PATH="/opt/workspaces/parkinglot"
          cat .github/workflows/scripts/droplet-remote-checks.sh | ssh -oBatchMode=yes \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "cd $(printf '%q' "$REMOTE_PATH") && COUNTY_FIPS=$(printf '%q' "$COUNTY_FIPS") MAX_AUTO_PIPELINE=$(printf '%q' "$MAX_AUTO_PIPELINE") bash -s -- wa-ingest-county-now deploy/docker-compose.production.ghcr.yml"
