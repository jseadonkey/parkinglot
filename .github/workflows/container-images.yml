# Optional: push the API/worker image to GHCR so a Droplet can `docker pull` instead of `--build`.
# Set repo Actions permission: Settings → Actions → General → Workflow permissions → Read and write.
# Approval UI image: .github/workflows/container-images-ui.yml (workflow_dispatch; pass PUBLIC_API_URL).

name: Container images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      extra_tag:
        description: "Optional extra image tag (e.g. v0.3.0 — immutable deploy pin)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: GHCR image owner (lowercase)
        id: ghcr
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute API image tags
        id: apitags
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          OWNER='${{ steps.ghcr.outputs.owner }}'
          TAGS="ghcr.io/${OWNER}/parking-acquisition-api:latest"$'\n'"ghcr.io/${OWNER}/parking-acquisition-api:${{ github.sha }}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${{ inputs.extra_tag }}" ]; then
            TAGS="${TAGS}"$'\n'"ghcr.io/${OWNER}/parking-acquisition-api:${{ inputs.extra_tag }}"
          fi
          {
            echo 'tags<<EOF'
            echo "$TAGS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push API / worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: ${{ steps.apitags.outputs.tags }}
