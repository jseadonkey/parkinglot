# Writes ops/deploy-last-run.json after every Deploy to Droplet completes so Cursor/agents can read it from git.
# Commit uses [skip ci]; deploy/ci workflows ignore this path on push to avoid loops and extra emails.

name: Record deploy outcome

on:
  workflow_run:
    workflows: ["Deploy to Droplet"]
    types: [completed]

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Write ops/deploy-last-run.json
        env:
          WF: ${{ toJson(github.event.workflow_run) }}
        run: |
          mkdir -p ops
          echo "$WF" | jq --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              id, conclusion, status, head_branch, head_sha, html_url,
              created_at, updated_at, display_title: .display_title,
              event: .event, run_attempt,
              snapshot_recorded_at: $ts
            }' > ops/deploy-last-run.json

      - name: Commit snapshot
        continue-on-error: true
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add ops/deploy-last-run.json
          git diff --staged --quiet && exit 0
          git commit -m "chore(ops): record Deploy to Droplet outcome [skip ci]"
          git push
