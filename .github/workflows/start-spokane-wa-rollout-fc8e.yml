name: Start Spokane WA rollout once

on:
  push:
    branches:
      - cursor/start-spokane-wa-rollout-fc8e
    paths:
      - ".github/workflows/start-spokane-wa-rollout-fc8e.yml"
      - ".github/workflows/scripts/droplet-remote-checks.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: start-spokane-wa-rollout-fc8e
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}

      - name: Configure SSH known_hosts
        run: |
          install -d -m 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Enqueue next WA rollout county
        env:
          DROPLET_REMOTE_PATH: ${{ vars.DROPLET_REMOTE_PATH }}
        run: |
          set -euo pipefail
          RAW="${DROPLET_REMOTE_PATH:-/opt/workspaces/parkinglot}"
          REMOTE_PATH="$(printf '%s' "$RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [ -n "$REMOTE_PATH" ] || REMOTE_PATH="/opt/workspaces/parkinglot"

          cat .github/workflows/scripts/droplet-remote-checks.sh | ssh -oBatchMode=yes \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "cd $(printf '%q' "$REMOTE_PATH") && bash -s -- wa-rollout-status deploy/docker-compose.production.ghcr.yml"

          cat .github/workflows/scripts/droplet-remote-checks.sh | ssh -oBatchMode=yes \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "cd $(printf '%q' "$REMOTE_PATH") && bash -s -- wa-rollout-now deploy/docker-compose.production.ghcr.yml"

          cat .github/workflows/scripts/droplet-remote-checks.sh | ssh -oBatchMode=yes \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "cd $(printf '%q' "$REMOTE_PATH") && bash -s -- wa-rollout-status deploy/docker-compose.production.ghcr.yml"
