# Deploy repo to your DigitalOcean Droplet over SSH and rebuild the production stack.
#
# Required repository secrets:
#   DROPLET_HOST          — public IPv4 or DNS
#   DROPLET_USER          — e.g. root
#   DROPLET_SSH_PRIVATE_KEY — full private key (ed25519 or RSA), multiline
#
# Optional repository variables (Settings → Secrets and variables → Actions → Variables):
#   DROPLET_REMOTE_PATH   — default /opt/parking-acquisition-agents
#
# Optional workflow input verify_public_ready (default true): curls PUBLIC_API_URL/ready from the Droplet after deploy.
#
# Optional Slack ping after a successful deploy:
#   slack_notify (default false) — POST /internal/slack/test-message from the Droplet
#   post_slack_tasks (default none) — run scripts/post-deploy-slack.sh on the Droplet to enqueue
#     digest / qualified-parcels / dual-agent discussion Celery jobs (API + worker must be up)
#   Repository secret SLACK_DEPLOY_NOTIFY_INTERNAL_API_KEY — same value as INTERNAL_API_KEY in deploy/.env when the API enforces it
#
# Automatic deploy (no GitHub UI): push to `main` or `cursor/dual-scoring-agents-slack-channel` runs the same job with
#   verify_public_ready=false, post_slack_tasks=all, use_local_postgis=false (Managed Postgres in deploy/.env). For a
#   on-VM PostGIS container instead, run workflow_dispatch and set use_local_postgis=true. Adjust branches in `on.push` if needed.

name: Deploy to Droplet

on:
  push:
    branches:
      - main
      - cursor/dual-scoring-agents-slack-channel
    paths-ignore:
      - "ops/deploy-last-run.json"
  workflow_dispatch:
    inputs:
      compose_file:
        description: "Compose file (under deploy/)"
        type: choice
        default: docker-compose.production.yml
        options:
          - docker-compose.production.yml
          - docker-compose.production.ghcr.yml
          - docker-compose.production.ghcr-full.yml
      verify_public_ready:
        description: "After compose up, curl PUBLIC_API_URL/ready (needs real DNS + TLS — off if .env still uses example.com)"
        type: boolean
        default: false
      slack_notify:
        description: "After deploy (and verify if enabled), POST /internal/slack/test-message — needs Slack env on Droplet"
        type: boolean
        default: false
      slack_notify_text:
        description: "Slack message body (plain text, max 2000). Leave empty for a default line with repo / sha / run link."
        type: string
        default: ""
      slack_notify_channel_id:
        description: "Optional Slack channel ID (C…). Empty uses SLACK_DIGEST_CHANNEL_ID from deploy/.env on the server."
        type: string
        default: ""
      use_local_postgis:
        description: "Also pass -f deploy/docker-compose.postgis-addon.yml (on-droplet PostGIS). Off when using only Managed Postgres."
        type: boolean
        default: false
      post_slack_tasks:
        description: "After compose up, enqueue Slack Celery tasks via scripts/post-deploy-slack.sh (needs Slack + channels in deploy/.env)"
        type: choice
        default: none
        options:
          - none
          - digest
          - qualified
          - discussion
          - all

concurrency:
  group: deploy-droplet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Silence GitHub deprecation warning for actions running on Node 20 (until default is Node 24).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      # Push events have no workflow_dispatch `inputs`; branch sets sane defaults so one job fits both triggers.
      - name: Resolve deploy options
        id: opts
        env:
          DISP_COMPOSE: ${{ github.event.inputs.compose_file }}
          DISP_VERIFY: ${{ github.event.inputs.verify_public_ready }}
          DISP_POSTGIS: ${{ github.event.inputs.use_local_postgis }}
          DISP_POST_SLACK: ${{ github.event.inputs.post_slack_tasks }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "compose_file=docker-compose.production.ghcr.yml" >> "$GITHUB_OUTPUT"
            echo "use_local_postgis=false" >> "$GITHUB_OUTPUT"
            echo "verify_public_ready=false" >> "$GITHUB_OUTPUT"
            echo "post_slack_tasks=all" >> "$GITHUB_OUTPUT"
          else
            echo "compose_file=${DISP_COMPOSE:-docker-compose.production.yml}" >> "$GITHUB_OUTPUT"
            echo "use_local_postgis=${DISP_POSTGIS:-true}" >> "$GITHUB_OUTPUT"
            echo "verify_public_ready=${DISP_VERIFY:-true}" >> "$GITHUB_OUTPUT"
            echo "post_slack_tasks=${DISP_POST_SLACK:-none}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}

      - name: Configure SSH known_hosts
        run: |
          install -d -m 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Repository variables sometimes paste with a trailing newline — breaks rsync/SSH into "bash: /: Is a directory".
      - name: Sanitize remote path
        run: |
          RAW="${DROPLET_REMOTE_PATH:-/opt/parking-acquisition-agents}"
          CLEAN="$(printf '%s' "$RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [ -n "$CLEAN" ] || CLEAN="/opt/parking-acquisition-agents"
          echo "DEPLOY_REMOTE_PATH=$CLEAN" >> "$GITHUB_ENV"
          echo "Using DEPLOY_REMOTE_PATH=$CLEAN"
        env:
          DROPLET_REMOTE_PATH: ${{ vars.DROPLET_REMOTE_PATH }}

      - name: Ensure remote directory
        run: |
          REMOTE_PATH="${DEPLOY_REMOTE_PATH:-/opt/parking-acquisition-agents}"
          ssh "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" "mkdir -p '$REMOTE_PATH'"

      - name: Rsync application
        run: |
          REMOTE_PATH="${DEPLOY_REMOTE_PATH:-/opt/parking-acquisition-agents}"
          rsync -az --delete \
            --exclude .git \
            --exclude node_modules \
            --exclude .venv \
            --exclude __pycache__ \
            --exclude .next \
            --exclude '*.pyc' \
            --exclude .env \
            --exclude deploy/.env \
            ./ "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:$REMOTE_PATH/"

      # bash <<EOF requires closing EOF at column 0; YAML-indented EOF breaks the heredoc.
      - name: Require deploy/.env on Droplet
        run: |
          set -euo pipefail
          REMOTE_PATH="${DEPLOY_REMOTE_PATH:-/opt/parking-acquisition-agents}"
          USER_HOST="${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}"
          ssh -oBatchMode=yes "$USER_HOST" \
            bash -s -- "$REMOTE_PATH" "$USER_HOST" <<'EOS'
          set -euo pipefail
          REMOTE_PATH="$1"
          USER_HOST="$2"

          cd "$REMOTE_PATH"
          if [ -f deploy/.env ]; then
            exit 0
          fi
          echo "Missing: ${REMOTE_PATH}/deploy/.env on the Droplet." >&2
          echo "Bootstrap (interactive): ssh -t ${USER_HOST} \"cd '${REMOTE_PATH}/deploy' && cp env.production.example .env && chmod 600 .env && (command -v nano >/dev/null 2>&1 && nano .env || vi .env)\"" >&2
          echo "Then re-run Deploy to Droplet." >&2
          exit 1
          EOS

      - name: Ensure API_IMAGE in deploy/.env (GHCR)
        if: steps.opts.outputs.compose_file == 'docker-compose.production.ghcr.yml' || steps.opts.outputs.compose_file == 'docker-compose.production.ghcr-full.yml'
        run: |
          set -euo pipefail
          REMOTE_PATH="${DEPLOY_REMOTE_PATH:-/opt/parking-acquisition-agents}"
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          DEFAULT_IMAGE="ghcr.io/${OWNER}/parking-acquisition-api:latest"
          ssh -oBatchMode=yes "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "REMOTE_PATH=$(printf '%q' "$REMOTE_PATH") DEFAULT_IMAGE=$(printf '%q' "$DEFAULT_IMAGE") bash -c '
          set -euo pipefail
          cd \"$REMOTE_PATH\"
          test -f deploy/.env
          python3 <<\"PY\"
          import os
          import pathlib
          import re

          root = pathlib.Path.cwd()
          env_path = root / \"deploy\" / \".env\"
          text = env_path.read_text(encoding=\"utf-8\")
          image = os.environ[\"DEFAULT_IMAGE\"]
          if re.search(r\"^API_IMAGE=\", text, re.M):
              text = re.sub(r\"^API_IMAGE=.*$\", f\"API_IMAGE={image}\", text, count=1, flags=re.M)
          else:
              text = text.rstrip() + f\"\\nAPI_IMAGE={image}\\n\"
          env_path.write_text(text, encoding=\"utf-8\")
          print(\"API_IMAGE set to\", image)
          PY
          '"

      - name: Pull GHCR images
        if: steps.opts.outputs.compose_file == 'docker-compose.production.ghcr.yml' || steps.opts.outputs.compose_file == 'docker-compose.production.ghcr-full.yml'
        run: |
          set -euo pipefail
          REMOTE_PATH="${DEPLOY_REMOTE_PATH:-/opt/parking-acquisition-agents}"
          COMPOSE_FILE="deploy/${{ steps.opts.outputs.compose_file }}"
          PG_EXTRA=""
          if [ "${{ steps.opts.outputs.use_local_postgis }}" = "true" ]; then
            PG_EXTRA="-f deploy/docker-compose.postgis-addon.yml"
          fi
          ssh "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "set -euo pipefail && cd '$REMOTE_PATH' && docker compose -f '$COMPOSE_FILE' $PG_EXTRA --env-file deploy/.env pull api worker beat"

      - name: Docker compose up
        run: |
          set -euo pipefail
          REMOTE_PATH="${DEPLOY_REMOTE_PATH:-/opt/parking-acquisition-agents}"
          COMPOSE_FILE="deploy/${{ steps.opts.outputs.compose_file }}"
          COMPOSE_BASENAME="${{ steps.opts.outputs.compose_file }}"
          PG_EXTRA=""
          if [ "${{ steps.opts.outputs.use_local_postgis }}" = "true" ]; then
            PG_EXTRA="-f deploy/docker-compose.postgis-addon.yml"
          fi
          if [ "$COMPOSE_BASENAME" = "docker-compose.production.ghcr.yml" ] || [ "$COMPOSE_BASENAME" = "docker-compose.production.ghcr-full.yml" ]; then
            # GHCR: pull API image; rebuild browser UIs from synced repo (proxy routes, env).
            UP_CMD="docker compose -f '$COMPOSE_FILE' $PG_EXTRA --env-file deploy/.env up -d --no-build --force-recreate redis api worker beat && docker compose -f '$COMPOSE_FILE' $PG_EXTRA --env-file deploy/.env up -d --build approval-ui operator-console"
          else
            UP_CMD="docker compose -f '$COMPOSE_FILE' $PG_EXTRA --env-file deploy/.env up -d --build"
          fi
          ssh "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "set -euo pipefail && cd '$REMOTE_PATH' && $UP_CMD && docker compose -f '$COMPOSE_FILE' $PG_EXTRA --env-file deploy/.env ps api worker beat approval-ui operator-console && (docker compose -f '$COMPOSE_FILE' $PG_EXTRA --env-file deploy/.env logs api --tail 40 || true)"

      # Do not fail the whole deploy if Slack enqueue fails (containers are already updated).
      - name: Enqueue Slack tasks (post-deploy script)
        id: post_slack
        continue-on-error: true
        if: steps.opts.outputs.post_slack_tasks != 'none'
        run: |
          set -euo pipefail
          REMOTE_PATH="${DEPLOY_REMOTE_PATH:-/opt/parking-acquisition-agents}"
          MODE="${{ steps.opts.outputs.post_slack_tasks }}"
          ssh -oBatchMode=yes "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            bash -s -- "$REMOTE_PATH" "$MODE" <<'EOS'
          set -euo pipefail
          REMOTE_PATH="$1"
          MODE="$2"
          cd "$REMOTE_PATH"
          test -f deploy/.env
          test -f scripts/post-deploy-slack.sh
          # Avoid exit 126 if +x is stripped on rsync / filesystem — bash runs without execute bit.
          bash scripts/post-deploy-slack.sh "$MODE"
          EOS

      - name: Post-deploy Slack status
        if: steps.opts.outputs.post_slack_tasks != 'none' && always()
        run: |
          if [ "${{ steps.post_slack.outcome }}" = "success" ]; then
            echo "Post-deploy Slack enqueue: OK"
          else
            echo "::warning::Post-deploy Slack enqueue failed — check api/worker logs on the Droplet and re-run digest manually."
          fi

      - name: Verify /ready (on Droplet)
        if: steps.opts.outputs.verify_public_ready == 'true'
        run: |
          set -euo pipefail
          REMOTE_PATH="${DEPLOY_REMOTE_PATH:-/opt/parking-acquisition-agents}"
          ssh -oBatchMode=yes "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            bash -s -- "$REMOTE_PATH" <<'EOS'
          set -euo pipefail
          REMOTE_PATH="$1"

          cd "$REMOTE_PATH"
          test -f deploy/.env
          BASE=$(grep -E '^PUBLIC_API_URL=' deploy/.env | head -1 | cut -d= -f2- | tr -d '\r' | sed 's/^"//;s/"$//')
          if [ -z "$BASE" ]; then
            H=$(grep -E '^API_HOST=' deploy/.env | head -1 | cut -d= -f2- | tr -d '\r' | sed 's/^"//;s/"$//')
            BASE="https://$H"
          fi
          echo "GET $BASE/ready"
          # -k: Caddy may use tls internal (self-signed) on alternate ports or before LE is live.
          curl -fsSk --connect-timeout 15 --max-time 30 "$BASE/ready"
          echo
          EOS

      - name: Notify Slack (internal API)
        if: github.event_name == 'workflow_dispatch' && inputs.slack_notify
        env:
          SLACK_DEPLOY_NOTIFY_INTERNAL_API_KEY: ${{ secrets.SLACK_DEPLOY_NOTIFY_INTERNAL_API_KEY }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          REF="${{ github.ref_name }}"
          SHA="${{ github.sha }}"
          SHA7="${SHA:0:7}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DEFAULT_MSG="Deploy OK: ${REPO} @ ${SHA7} (${REF}) — ${RUN_URL}"
          TEXT_INPUT="${{ inputs.slack_notify_text }}"
          if [ -n "$TEXT_INPUT" ]; then NOTIFY_TEXT="$TEXT_INPUT"; else NOTIFY_TEXT="$DEFAULT_MSG"; fi
          export NOTIFY_TEXT
          export NOTIFY_CHANNEL_ID="${{ inputs.slack_notify_channel_id }}"
          PAYLOAD_JSON=$(python3 <<'PY'
          import json
          import os

          body = {"text": os.environ["NOTIFY_TEXT"]}
          cid = (os.environ.get("NOTIFY_CHANNEL_ID") or "").strip()
          if cid:
              body["channel_id"] = cid
          print(json.dumps(body))
          PY
          )
          REMOTE_PATH="${DEPLOY_REMOTE_PATH:-/opt/parking-acquisition-agents}"
          KEY="${SLACK_DEPLOY_NOTIFY_INTERNAL_API_KEY:-}"
          ssh -oBatchMode=yes "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            bash -s -- "$REMOTE_PATH" "$PAYLOAD_JSON" "$KEY" <<'EOS'
          set -euo pipefail
          REMOTE_PATH="$1"
          PAYLOAD_JSON="$2"
          KEY="${3:-}"

          cd "$REMOTE_PATH"
          test -f deploy/.env
          BASE=$(grep -E '^PUBLIC_API_URL=' deploy/.env | head -1 | cut -d= -f2- | tr -d '\r' | sed 's/^"//;s/"$//')
          if [ -z "$BASE" ]; then
            H=$(grep -E '^API_HOST=' deploy/.env | head -1 | cut -d= -f2- | tr -d '\r' | sed 's/^"//;s/"$//')
            BASE="https://$H"
          fi
          echo "POST $BASE/internal/slack/test-message"
          if [ -n "$KEY" ]; then
            curl -fsSk --connect-timeout 15 --max-time 60 -X POST "$BASE/internal/slack/test-message" \
              -H "Content-Type: application/json" \
              -H "X-Internal-Key: $KEY" \
              -d "$PAYLOAD_JSON"
          else
            curl -fsSk --connect-timeout 15 --max-time 60 -X POST "$BASE/internal/slack/test-message" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD_JSON"
          fi
          echo
          EOS
