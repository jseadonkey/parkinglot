# Build and push the approval UI to GHCR. NEXT_PUBLIC_API_URL is baked at build time — it must
# match your live API (e.g. https://api.yourdomain.com).

name: Container image — approval UI

on:
  workflow_dispatch:
    inputs:
      public_api_url:
        description: "Production API URL (NEXT_PUBLIC_API_URL), e.g. https://api.example.com"
        required: true
        type: string
      extra_tag:
        description: "Optional extra image tag (e.g. v0.3.0)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: GHCR image owner (lowercase)
        id: ghcr
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: uitags
        env:
          EXTRA: ${{ inputs.extra_tag }}
        run: |
          OWNER='${{ steps.ghcr.outputs.owner }}'
          TAGS="ghcr.io/${OWNER}/parking-acquisition-approval-ui:latest"$'\n'"ghcr.io/${OWNER}/parking-acquisition-approval-ui:${{ github.sha }}"
          if [ -n "$EXTRA" ]; then
            TAGS="${TAGS}"$'\n'"ghcr.io/${OWNER}/parking-acquisition-approval-ui:${EXTRA}"
          fi
          {
            echo 'tags<<EOF'
            echo "$TAGS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push approval UI
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/approval-ui/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ inputs.public_api_url }}
          tags: ${{ steps.uitags.outputs.tags }}
