name: DO — fetch Spaces key metadata

# Lists Spaces access keys (bucket names, key IDs). Does NOT print secret keys.
# Requires GitHub secret DO_TOKEN with spaces_key:read (often included under "spaces:read").

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  print:
    runs-on: ubuntu-latest
    steps:
      - name: List Spaces keys (read-only)
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DO_TOKEN:-}" ]; then
            echo "Missing GitHub secret: DO_TOKEN"
            echo "Create a read-capable token (include Spaces key read) and add DO_TOKEN under repo Action secrets."
            exit 1
          fi

          python3 <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["DO_TOKEN"]
          base = "https://api.digitalocean.com/v2/spaces/keys"

          def get(url: str) -> dict:
              req = urllib.request.Request(
                  url,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
                  method="GET",
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  print(f"DigitalOcean API HTTP {e.code}: {body}")
                  sys.exit(1)

          all_keys = []
          url = base + "?" + urllib.parse.urlencode({"per_page": "200"})
          while url:
              payload = get(url)
              keys = payload.get("keys") or []
              all_keys.extend(keys)
              nxt = (payload.get("links") or {}).get("pages", {}).get("next")
              url = nxt or ""

          if not all_keys:
              print("No Spaces keys returned (empty list or token lacks spaces_key:read).")
              sys.exit(0)

          print("=== DigitalOcean Spaces access keys (metadata only) ===")
          for k in all_keys:
              ak = k.get("access_key") or k.get("name")
              bucket = k.get("bucket")
              name = k.get("name")
              grants = k.get("grants")
              print(f"\nKey: {name or ak}")
              print(f"  access_key_id: {ak}")
              print(f"  bucket: {bucket}")
              if grants:
                  print(f"  grants: {grants}")

          print(
              "\nFor deploy/.env map roughly: STORAGE_BUCKET=<bucket>, "
              "STORAGE_ENDPOINT=https://<region>.digitaloceanspaces.com, "
              "STORAGE_REGION=us-east-1 (S3 compat — see env.production.example), "
              "STORAGE_ACCESS_KEY / STORAGE_SECRET_KEY from Terraform or DO UI (secrets not shown here)."
          )
          PY
