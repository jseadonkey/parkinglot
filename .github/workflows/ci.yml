name: CI

on:
  # Avoid running lint/test twice on every PR update (push + pull_request). Feature
  # branches get CI from pull_request; main gets CI when commits land after merge.
  push:
    branches: [main]
    paths-ignore:
      - "ops/deploy-last-run.json"
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install ruff==0.9.7
      - name: Ruff check
        run: ruff check packages/core services/api/app services/scoring services/ingestion services/enrichment services/workflows services/api/tests scripts

  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/core/pyproject.toml
            services/scoring/pyproject.toml
            services/ingestion/pyproject.toml
            services/enrichment/pyproject.toml
            services/workflows/pyproject.toml
            services/api/pyproject.toml
      - name: Install workspace packages
        run: |
          set -euo pipefail
          pip install --upgrade pip
          pip install ./packages/core
          pip install ./services/scoring
          pip install ./services/ingestion
          pip install ./services/enrichment
          pip install ./services/workflows
          pip install "./services/api[dev]"
      - name: Pytest (API)
        working-directory: services/api
        run: pytest

      - name: OpenAPI JSON export
        run: |
          set -euo pipefail
          python3 scripts/export_openapi_json.py -o openapi.json
          python3 -m json.tool openapi.json > /dev/null

      - uses: actions/upload-artifact@v4
        name: Upload OpenAPI JSON
        with:
          name: openapi
          path: openapi.json
          retention-days: 14

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (smoke)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: parking-acquisition-api:ci
          build-args: |
            APP_VERSION=${{ github.sha }}

      - name: Build approval UI image (smoke)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/approval-ui/Dockerfile
          push: false
          tags: parking-acquisition-ui:ci
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.ci.test

      - name: Validate compose files
        run: |
          set -euo pipefail
          for f in \
            deploy/docker-compose.production.yml \
            deploy/docker-compose.production.ghcr.yml \
            deploy/docker-compose.production.ghcr-full.yml \
            docker-compose.yml
          do
            echo "==> docker compose config: $f"
            docker compose -f "$f" --env-file deploy/ci.env config --quiet
          done
          echo "==> docker compose config: production + postgis addon"
          docker compose \
            -f deploy/docker-compose.production.yml \
            -f deploy/docker-compose.postgis-addon.yml \
            --env-file deploy/ci.env config --quiet

      - name: Syntax-check bash scripts (phase runners + ci-api-local)
        run: |
          set -euo pipefail
          for f in scripts/execute-phase-a.sh scripts/execute-phase-b.sh scripts/execute-phase-c.sh scripts/ci-api-local.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done
