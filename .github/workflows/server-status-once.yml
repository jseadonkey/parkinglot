name: Server status once

on:
  push:
    branches:
      - cursor/wa-zoning-followup-9516
    paths:
      - ".github/workflows/server-status-once.yml"

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}

      - name: Configure SSH known_hosts
        run: |
          install -d -m 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Server resources and rollout status
        env:
          DROPLET_REMOTE_PATH: ${{ vars.DROPLET_REMOTE_PATH }}
        run: |
          set -euo pipefail
          RAW="${DROPLET_REMOTE_PATH:-/opt/workspaces/parkinglot}"
          REMOTE_PATH="$(printf '%s' "$RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [ -n "$REMOTE_PATH" ] || REMOTE_PATH="/opt/workspaces/parkinglot"
          echo "## resources"
          cat .github/workflows/scripts/droplet-remote-checks.sh | ssh -oBatchMode=yes \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "cd $(printf '%q' "$REMOTE_PATH") && bash -s -- resources deploy/docker-compose.production.yml"
          echo "## wa rollout"
          cat .github/workflows/scripts/droplet-remote-checks.sh | ssh -oBatchMode=yes \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "cd $(printf '%q' "$REMOTE_PATH") && bash -s -- wa-rollout-status deploy/docker-compose.production.yml"
