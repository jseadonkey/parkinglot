# Print CPU, memory, disk, and docker stats from the production Droplet.

name: Droplet resources (via Droplet)

on:
  workflow_dispatch:
    inputs:
      grow_disk:
        description: "Grow root filesystem after a DigitalOcean volume resize"
        type: boolean
        default: false
      relieve_load:
        description: "Pause auto-enqueue and purge parking Celery backlog"
        type: boolean
        default: false
      probe_outreach_drafts:
        description: "Probe parcel outreach drafts endpoint and DB tables"
        type: boolean
        default: false
      enable_enqueue:
        description: "Re-enable scheduled incomplete-pipeline enqueue (safe default limit 50)"
        type: boolean
        default: false
      enqueue_limit:
        description: "Parcels per scheduled enqueue run (when enable_enqueue is true)"
        type: string
        default: "50"
      probe_pipeline_velocity:
        description: "Report enqueue settings, queue depth, and export-readiness backlog"
        type: boolean
        default: false
      fix_watchdog_env:
        description: "Set SITE_WATCHDOG_UI_BASE_URL in deploy/.env and restart worker-slack + beat"
        type: boolean
        default: false
      sync_slack_channels:
        description: "Point watchdog + agent-discussion channels at SLACK_DIGEST_CHANNEL_ID"
        type: boolean
        default: false
      fix_hourly_slack_reports:
        description: "Hourly pipeline digest + site watchdog Slack (env + restart beat/worker-slack)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}

      - name: Configure SSH known_hosts
        run: |
          install -d -m 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: CPU, RAM, disk, docker stats
        env:
          DROPLET_REMOTE_PATH: ${{ vars.DROPLET_REMOTE_PATH }}
        run: |
          set -euo pipefail
          RAW="${DROPLET_REMOTE_PATH:-/opt/parking-acquisition-agents}"
          REMOTE_PATH="$(printf '%s' "$RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [ -n "$REMOTE_PATH" ] || REMOTE_PATH="/opt/parking-acquisition-agents"
          MODE="resources"
          if [ "${{ inputs.grow_disk }}" = "true" ]; then
            MODE="disk-grow"
          elif [ "${{ inputs.relieve_load }}" = "true" ]; then
            MODE="relieve-load"
          elif [ "${{ inputs.probe_outreach_drafts }}" = "true" ]; then
            MODE="outreach-drafts"
          elif [ "${{ inputs.enable_enqueue }}" = "true" ]; then
            MODE="enable-enqueue"
          elif [ "${{ inputs.probe_pipeline_velocity }}" = "true" ]; then
            MODE="pipeline-velocity"
          elif [ "${{ inputs.fix_watchdog_env }}" = "true" ]; then
            MODE="fix-watchdog-env"
          elif [ "${{ inputs.sync_slack_channels }}" = "true" ]; then
            MODE="sync-slack-channels"
          elif [ "${{ inputs.fix_hourly_slack_reports }}" = "true" ]; then
            MODE="fix-hourly-slack-reports"
          fi
          ENQUEUE_LIMIT="${{ inputs.enqueue_limit || '50' }}"
          cat .github/workflows/scripts/droplet-remote-checks.sh | ssh -oBatchMode=yes \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
            "cd $(printf '%q' "$REMOTE_PATH") && ENQUEUE_LIMIT=$(printf '%q' "$ENQUEUE_LIMIT") bash -s -- ${MODE} deploy/docker-compose.production.ghcr.yml"
