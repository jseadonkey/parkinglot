[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parking-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "pydantic-settings>=2.2",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "geoalchemy2>=0.14",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "celery>=5.3",
  "redis>=5.0",
  "boto3>=1.34",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "slack-sdk>=3.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
