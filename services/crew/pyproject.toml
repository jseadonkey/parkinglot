[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parking-crew"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "crewai>=0.80",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
  "PyGithub>=2.3",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "slack-sdk>=3.27",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
observability = [
  "langfuse>=3.0",
  "openinference-instrumentation-crewai>=0.1.17",
]

[project.scripts]
parking-crew = "parking_crew.main:main"

[tool.hatch.build.targets.wheel]
packages = ["parking_crew"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
