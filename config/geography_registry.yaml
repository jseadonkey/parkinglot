version: 1
description: >
  Geography-agent registry for parcel acquisition. Each record binds a city,
  county, or county-unincorporated area to authoritative data sources, zoning
  jurisdiction keys, rules files, and validation checks.

generated_geography_paths:
  - config/generated/wa_city_geography_agents.yaml

sources:
  - key: watech_statewide_parcels
    name: Washington State Geospatial Open Data - Tax Parcels
    type: parcel
    url: https://geo.wa.gov/datasets/watech::tax-parcels/about
    cadence: nightly_or_weekly
    coverage: all_washington_counties
    notes: Used by fetch_watech_county_and_ingest for county-filtered parcel anchors.

  - key: census_tiger_incorporated_places_wa
    name: US Census TIGERweb Incorporated Places - Washington
    type: boundary
    url: https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/Places_CouSub_ConCity_SubMCD/MapServer/4/query
    cadence: annual
    coverage: all_washington_incorporated_places
    notes: Authoritative inventory for city-level agents and municipal boundary resolution.

  - key: census_tiger_counties_wa
    name: US Census TIGERweb Counties - Washington
    type: boundary
    url: https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer/1/query
    cadence: annual
    coverage: all_washington_counties
    notes: Used by the WA incorporated-place sync to assign city/town boundaries to counties.

  - key: census_tiger_incorporated_places_md
    name: US Census TIGERweb Incorporated Places - Maryland
    type: boundary
    url: https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/Places_CouSub_ConCity_SubMCD/MapServer/25/query
    cadence: annual
    coverage: all_maryland_incorporated_places
    notes: Authoritative inventory for Maryland municipal boundaries where applicable.

  - key: wa_county_zoning_inventory_template
    name: Washington county/city zoning source inventory
    type: zoning
    path: docs/washington-data.md
    cadence: weekly_review
    coverage: all_washington_counties_plus_municipal_jurisdictions
    notes: Washington zoning is municipal; city and county layers must be resolved per parcel.

  - key: wa_city_zoning_inventory_template
    name: Washington city zoning source inventory
    type: zoning
    path: docs/washington-data.md
    cadence: weekly_review
    coverage: all_washington_incorporated_places
    notes: Placeholder source inventory for generated city agents; replace per city as zoning layers are curated.

  - key: wa_city_rules_skeleton
    name: Washington city surface-parking rules skeleton
    type: zoning_rules
    path: data/zoning/wa/wa_city_surface_parking_rules_skeleton.yaml
    cadence: as_ordinances_change
    coverage: all_washington_incorporated_places
    notes: Conservative false-by-default skeleton for generated city jurisdiction keys.

  - key: wa_unincorporated_rules
    name: Washington pilot county unincorporated surface-parking rules
    type: zoning_rules
    path: data/zoning/wa/pilot_county_unincorporated_surface_parking_rules.yaml
    cadence: as_ordinances_change
    coverage: all_washington_pilot_county_unincorporated_jurisdictions
    notes: Conservative false-by-default skeleton until local ordinance entries are curated.

  - key: kent_city_boundary
    name: Kent city Census place boundary
    type: boundary
    path: data/boundaries/wa/kent_city_census_places.geojson
    cadence: annual
    coverage: kent_city

  - key: kent_city_zoning
    name: Kent zoning districts
    type: zoning
    url: https://gis-cityofkent.opendata.arcgis.com/datasets/kent-zoning-districts
    path: docs/zoning-sources-kent.md
    coverage: kent_city

  - key: kent_king_rules
    name: Kent city and King unincorporated surface-parking rules
    type: zoning_rules
    path: data/zoning/wa/kent_king_surface_parking_rules.yaml
    coverage: kent_city_and_king_unincorporated

  - key: king_unincorporated_zoning
    name: King County unincorporated zoning
    type: zoning
    url: https://gis-kingcounty.opendata.arcgis.com/datasets/kingcounty::zoning-for-unincorporated-king-county
    path: docs/zoning-sources-kent.md
    coverage: king_county_unincorporated

  - key: baltimore_city_parcels
    name: Baltimore City parcel source
    type: parcel
    url: https://egis.baltimorecity.gov/egis/rest/services/Parcel_Information/Parcel/FeatureServer/0
    path: docs/zoning-sources-baltimore.md
    coverage: baltimore_city

  - key: baltimore_city_zoning
    name: Baltimore City zoning districts
    type: zoning
    url: https://geodata.baltimorecity.gov/egis/rest/services/CityView/Zoning_New/MapServer/0
    path: docs/zoning-sources-baltimore.md
    coverage: baltimore_city

  - key: baltimore_city_rules
    name: Baltimore City surface-parking rules
    type: zoning_rules
    path: data/zoning/md/baltimore_city_surface_parking_rules.yaml
    coverage: baltimore_city

  - key: baltimore_county_parcels
    name: Baltimore County parcel source
    type: parcel
    path: docs/washington-data.md
    coverage: baltimore_county
    notes: Placeholder inventory record until county-specific parcel connector is selected.

  - key: baltimore_county_zoning
    name: Baltimore County zoning source
    type: zoning
    path: docs/data-vendor-shortlist.md
    coverage: baltimore_county
    notes: Placeholder inventory record until county/city zoning layer is staged.

  - key: baltimore_county_rules
    name: Baltimore County surface-parking rules
    type: zoning_rules
    path: data/zoning/md/baltimore_county_surface_parking_rules.yaml
    coverage: baltimore_county
    notes: Conservative false-by-default skeleton until ordinance entries are curated.

city_inventory_sources:
  - state_fips: "53"
    state: WA
    source_ref: census_tiger_incorporated_places_wa
    coverage: all_incorporated_places
    agent_key_template: "wa_{place_geoid}_{slug}"
    jurisdiction_key_template: "{slug}_city"
    manifest_path: data/boundaries/wa/manifest/wa_incorporated_places.json
  - state_fips: "24"
    state: MD
    source_ref: census_tiger_incorporated_places_md
    coverage: all_incorporated_places
    agent_key_template: "md_{place_geoid}_{slug}"
    jurisdiction_key_template: "{slug}_city"

geographies:
  - key: baltimore_city
    name: Baltimore City, MD
    type: consolidated_city_county
    state_fips: "24"
    county_fips: "24510"
    jurisdiction_key: baltimore_city
    default_for_county: true
    source_refs: [baltimore_city_parcels, baltimore_city_zoning, baltimore_city_rules]
    zoning_rules_paths: [data/zoning/md/baltimore_city_surface_parking_rules.yaml]

