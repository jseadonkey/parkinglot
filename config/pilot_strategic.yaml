# Alternate scoring profile — "strategic / demand" agent (Agent Beacon).
# Same region and deal rails as pilot.yaml; different scoring philosophy:
# emphasize proximity to demand and corner visibility; zoning is still important but weighted lower.
# CRS and ingest geometry unchanged.

crs: EPSG:4326

region:
  name: "Baltimore + Washington — strategic demand screen"
  state_fips: "53"
  county_fips:
    - "24510" # Baltimore City, MD
    - "24005" # Baltimore County, MD
    - "53001"
    - "53003"
    - "53005"
    - "53007"
    - "53009"
    - "53011"
    - "53013"
    - "53015"
    - "53017"
    - "53019"
    - "53021"
    - "53023"
    - "53025"
    - "53027"
    - "53029"
    - "53031"
    - "53033"
    - "53035"
    - "53037"
    - "53039"
    - "53041"
    - "53043"
    - "53045"
    - "53047"
    - "53049"
    - "53051"
    - "53053"
    - "53055"
    - "53057"
    - "53059"
    - "53061"
    - "53063"
    - "53065"
    - "53067"
    - "53069"
    - "53071"
    - "53073"
    - "53075"
    - "53077"
  primary_metro_cbsa: "42660"

deal:
  primary_structure: ground_lease
  allowed_structures:
    - ground_lease
    - purchase_option
  templates_require_legal_review: true

compliance:
  allowed_outreach_channels: []
  require_human_approval_for:
    - outbound_message
    - contract_send
    - contract_execute
  tcpa_can_spam_review_required: true

scoring:
  # Slightly smaller minimum — urban pads can still work with entitlement/legal path elsewhere.
  min_lot_sqft: 4000
  qualified_min_score: 65
  weights:
    zoning_permitted_surface_parking: 22
    zoning_conditional_surface_parking: 8
    lot_size: 18
    corner_lot: 13
    near_demand_generator_m: 35
    near_paid_parking_comps: 12
    vacant_or_underutilized: 10
  demand_generator_buffer_m: 500
  parking_rate_comp_radius_m: 2500
  parking_rate_comp_min_for_full_credit: 2
  parking_rate_comp_max_used: 8
  demand_generators:
    - name: "Seattle downtown (illustrative)"
      lat: 47.6062
      lon: -122.3321

data_sources:
  parcel_vendor: "TBD — see docs/washington-data.md"
  zoning_vendor: "docs/zoning-sources-kent.md + data/zoning/wa/kent_king_surface_parking_rules.yaml"
  poi_source: "osm_or_commercial_tbd"
