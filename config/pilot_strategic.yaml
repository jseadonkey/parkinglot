# Alternate scoring profile — "strategic / demand" agent (Agent Beacon).
# Same region and deal rails as pilot.yaml; different scoring philosophy:
# emphasize proximity to demand and corner visibility; zoning is still important but weighted lower.
# CRS and ingest geometry unchanged.

crs: EPSG:4326

region:
  name: "King County — Kent pilot"
  state_fips: "53"
  county_fips:
    - "53033" # King
  primary_metro_cbsa: "42660"
  in_scope:
    kent_city_boundary_geojson: data/boundaries/wa/kent_city_census_places.geojson
    excluded_incorporated_places_geojson: data/boundaries/wa/king_county_incorporated_excluding_kent.geojson

deal:
  primary_structure: master_lease
  allowed_structures:
    - master_lease
    - ground_lease
  templates_require_legal_review: true
  operations:
    site_use: standalone_unmanned_parking_lot
    lease_model: master_lease
    summary: >
      Master-lease land for standalone, unmanned surface parking only — see config/pilot.yaml operations block.
    partial_lot_note: >
      Partially developed lots (e.g. half built, half empty) may qualify if the empty portion
      can support unmanned surface parking — verify with zoning counsel.

compliance:
  allowed_outreach_channels: []
  require_human_approval_for:
    - outbound_message
    - contract_send
    - contract_execute
  tcpa_can_spam_review_required: true

scoring:
  # Slightly smaller minimum — urban pads can still work with entitlement/legal path elsewhere.
  min_lot_sqft: 4000
  qualified_min_score: 52
  weights:
    zoning_permitted_surface_parking: 25
    lot_size: 20
    corner_lot: 15
    near_demand_generator_m: 0
    near_parking_comp_m: 40
  demand_generator_buffer_m: 500
  parking_comp_market:
    enabled: true
    comps_path: data/pilot/kent_king_parking_comps.yaml
    buffer_m: 800
    min_rate_usd_per_day: 6.0
    premium_rate_usd_per_day: 15.0
  demand_generators:
    - name: "Kent Station (illustrative)"
      lat: 47.3854
      lon: -122.2399
    - name: "Aurora corridor — Federal Way border (illustrative)"
      lat: 47.35
      lon: -122.31

data_sources:
  parcel_vendor: "King County — see docs/washington-data.md"
  zoning_vendor: "docs/zoning-sources-kent.md + data/zoning/wa/kent_king_surface_parking_rules.yaml"
  poi_source: "osm_or_commercial_tbd"
