# Geographic priorities — Baltimore first; Washington statewide ingest stays slow/secondary.
# Loaded by app.geo_markets (see GEO_MARKETS_CONFIG_PATH).
#
# What belongs here vs elsewhere:
# - HERE: which markets are primary / priority counties / WA pacing knobs.
# - config/geo_scope.yaml: GLOBAL vs STATE/COUNTY/SOURCE principles + list budgets.
# - data/zoning/: local ordinance entitlement (never globalize zone codes).

primary_market:
  name: "Baltimore, Maryland"
  state_fips: "24"
  primary_metro_cbsa: "12580" # Baltimore-Columbia-Towson, MD
  # Pipeline enqueue and operator UI — Baltimore City only (county paused).
  priority_county_fips:
    - "24510" # Baltimore City
  # "24005" Baltimore County — paused; still in config/pilot.yaml for later.

# WaTech ingest pacing (also mirrored in config/wa_statewide_rollout.yaml).
wa_statewide_rollout:
  min_days_base: 0.1
  min_days_per_10k_parcels: 0.005
  min_days_max: 0.5
  max_auto_pipeline: 15
  max_parking_queue_depth: 400
