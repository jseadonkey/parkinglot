    - "53071"
    - "53073"
    - "53075"
    - "53077"
  primary_metro_cbsa: "42660"

deal:
  primary_structure: ground_lease
  allowed_structures:
    - ground_lease
    - purchase_option
  templates_require_legal_review: true

compliance:
  allowed_outreach_channels: []
  require_human_approval_for:
    - outbound_message
    - contract_send
    - contract_execute
  tcpa_can_spam_review_required: true

scoring:
  min_lot_sqft: 5000
  # Prescreen floor for queueing Atlas / human shortlists. Target stacks:
  # - vacant 15 + lot 25 + demand 20 = 60 (near county-seat demand)
  # - vacant 15 + lot 25 + WAZA provisional PV 15 = 55 (commercial class, even rural)
  # Counsel still gates owner outreach; this only ranks candidates.
  qualified_min_score: 50
  weights:
    zoning_permitted_surface_parking: 45
    zoning_conditional_surface_parking: 15
    lot_size: 25
    corner_lot: 10
    near_demand_generator_m: 20
    # Vacant land / low-improvement teardown candidates (assessor value fields).
    vacant_or_underutilized: 15
  # Wider than Atlas — county-seat POIs should cover small-city commercial rings.
  demand_generator_buffer_m: 1500
  demand_generators_paths:
    - demand_generators_baltimore.yaml
    - demand_generators_baltimore_tier_b.yaml
    - demand_generators_wa_county_seats.yaml
    - demand_generators_wa_cities.yaml
  demand_generators:
    - name: "Seattle downtown retail core"
      lat: 47.6062
      lon: -122.3321
    - name: "Bellevue downtown"
      lat: 47.6101
      lon: -122.2015

data_sources:
  parcel_vendor: "TBD — see docs/washington-data.md"
  zoning_vendor: "docs/zoning-sources-kent.md + data/zoning/wa/kent_king_surface_parking_rules.yaml"
  poi_source: "osm_or_commercial_tbd"
