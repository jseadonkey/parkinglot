# Identification / prescreen agent — same PilotConfig schema as pilot.yaml.
# Used when parcels are loaded/refreshed. Produces score_profile=identification:
# a 0–100 estimate from zoning flags, lot size, corner, and demand proximity using only
# attributes available at ingest (before enrichment / deal memo pipeline).
#
# Tune weights and qualified_min_score independently from Atlas (entitlement) and Beacon (strategic).

crs: EPSG:4326

region:
  name: "Baltimore + Washington — identification prescreen"
  state_fips: "53"
  county_fips:
    - "24510" # Baltimore City, MD
    - "24005" # Baltimore County, MD
    - "53001"
    - "53003"
    - "53005"
    - "53007"
    - "53009"
    - "53011"
    - "53013"
    - "53015"
    - "53017"
    - "53019"
    - "53021"
    - "53023"
    - "53025"
    - "53027"
    - "53029"
    - "53031"
    - "53033"
    - "53035"
    - "53037"
    - "53039"
    - "53041"
    - "53043"
    - "53045"
    - "53047"
    - "53049"
    - "53051"
    - "53053"
    - "53055"
    - "53057"
    - "53059"
    - "53061"
    - "53063"
    - "53065"
    - "53067"
    - "53069"
    - "53071"
    - "53073"
    - "53075"
    - "53077"
  primary_metro_cbsa: "42660"

deal:
  primary_structure: ground_lease
  allowed_structures:
    - ground_lease
    - purchase_option
  templates_require_legal_review: true

compliance:
  allowed_outreach_channels: []
  require_human_approval_for:
    - outbound_message
    - contract_send
    - contract_execute
  tcpa_can_spam_review_required: true

scoring:
  min_lot_sqft: 5000
  # Prescreen floor for queueing Atlas. Set above the non-zoned max
  # (lot + corner + demand = 55) so weak/no-zoning parcels do not consume pipeline.
  qualified_min_score: 60
  weights:
    zoning_permitted_surface_parking: 45
    zoning_conditional_surface_parking: 12
    lot_size: 25
    corner_lot: 10
    near_demand_generator_m: 20
  demand_generator_buffer_m: 450
  demand_generators:
    # South King / Kent anchor — replace with your submarket POIs.
    - name: "Kent core / Station corridor (illustrative)"
      lat: 47.384
      lon: -122.233
    # Benton County / Tri-Cities — used when scoring 53005 parcels after ingest.
    - name: "Kennewick Columbia Center corridor (illustrative)"
      lat: 46.212
      lon: -119.159
    - name: "Richland Parkway / George Washington Way (illustrative)"
      lat: 46.285
      lon: -119.275
    - name: "Pasco downtown / Lewis Street (illustrative)"
      lat: 46.239
      lon: -119.101

data_sources:
  parcel_vendor: "TBD — see docs/washington-data.md"
  zoning_vendor: "docs/zoning-sources-kent.md + data/zoning/wa/kent_king_surface_parking_rules.yaml"
  poi_source: "osm_or_commercial_tbd"
