# Identification / prescreen agent — same PilotConfig schema as pilot.yaml.
# Used only when parcels are loaded from GeoJSON (ingest). Produces score_profile=identification:
# a 0–100 estimate from zoning flags, lot size, corner, and demand proximity using only
# attributes available at ingest (before enrichment / deal memo pipeline).
#
# Tune weights and qualified_min_score independently from Atlas (entitlement) and Beacon (strategic).

crs: EPSG:4326

region:
  name: "King County — Kent pilot"
  state_fips: "53"
  county_fips:
    - "53033" # King
  primary_metro_cbsa: "42660"
  in_scope:
    kent_city_boundary_geojson: data/boundaries/wa/kent_city_census_places.geojson
    excluded_incorporated_places_geojson: data/boundaries/wa/king_county_incorporated_excluding_kent.geojson

deal:
  primary_structure: master_lease
  allowed_structures:
    - master_lease
    - ground_lease
  templates_require_legal_review: true
  operations:
    site_use: standalone_unmanned_parking_lot
    lease_model: master_lease
    summary: >
      Master-lease land for standalone, unmanned surface parking only — see config/pilot.yaml operations block.
    partial_lot_note: >
      Partially developed lots (e.g. half built, half empty) may qualify if the empty portion
      can support unmanned surface parking — verify with zoning counsel.

compliance:
  allowed_outreach_channels: []
  require_human_approval_for:
    - outbound_message
    - contract_send
    - contract_execute
  tcpa_can_spam_review_required: true

scoring:
  min_lot_sqft: 5000
  # Optional filter if you later expose identification-qualified listings — not used by GET /parcels?qualified_only=
  qualified_min_score: 45
  weights:
    zoning_permitted_surface_parking: 45
    lot_size: 25
    corner_lot: 10
    near_demand_generator_m: 0
    near_parking_comp_m: 20
  demand_generator_buffer_m: 450
  parking_comp_market:
    enabled: true
    comps_path: data/pilot/kent_king_parking_comps.yaml
    buffer_m: 800
    min_rate_usd_per_day: 6.0
    premium_rate_usd_per_day: 15.0
  demand_generators:
    # South King / Kent anchor — replace with your submarket POIs.
    - name: "Kent core / Station corridor (illustrative)"
      lat: 47.384
      lon: -122.233

data_sources:
  parcel_vendor: "King County — see docs/washington-data.md"
  zoning_vendor: "docs/zoning-sources-kent.md + data/zoning/wa/kent_king_surface_parking_rules.yaml"
  poi_source: "osm_or_commercial_tbd"
