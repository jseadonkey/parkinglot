# Multi-state pilot — Baltimore MD (priority) + Washington statewide
# CRS for stored geometries (PostGIS).
crs: EPSG:4326

region:
  name: "Baltimore MD (priority) + Washington statewide"
  state_fips: "53"
  # Baltimore metro first in pipeline priority; then all 39 Washington counties.
  county_fips:
    - "24510" # Baltimore City, MD
    - "24005" # Baltimore County, MD
    - "53001" # Adams
    - "53003" # Asotin
    - "53005" # Benton
    - "53007" # Chelan
    - "53009" # Clallam
    - "53011" # Clark
    - "53013" # Columbia
    - "53015" # Cowlitz
    - "53017" # Douglas
    - "53019" # Ferry
    - "53021" # Franklin
    - "53023" # Garfield
    - "53025" # Grant
    - "53027" # Grays Harbor
    - "53029" # Island
    - "53031" # Jefferson
    - "53033" # King
    - "53035" # Kitsap
    - "53037" # Kittitas
    - "53039" # Klickitat
    - "53041" # Lewis
    - "53043" # Lincoln
    - "53045" # Mason
    - "53047" # Okanogan
    - "53049" # Pacific
    - "53051" # Pend Oreille
    - "53053" # Pierce
    - "53055" # San Juan
    - "53057" # Skagit
    - "53059" # Skamania
    - "53061" # Snohomish
    - "53063" # Spokane
    - "53065" # Stevens
    - "53067" # Thurston
    - "53069" # Wahkiakum
    - "53071" # Walla Walla
    - "53073" # Whatcom
    - "53075" # Whitman
    - "53077" # Yakima
  primary_metro_cbsa: "42660" # Seattle-Tacoma-Bellevue, WA

deal:
  primary_structure: ground_lease
  allowed_structures:
    - ground_lease
    - purchase_option
  templates_require_legal_review: true
  auto_approve_deal_memo_publish: true

compliance:
  allowed_outreach_channels: []
  require_human_approval_for:
    - outbound_message
    - contract_send
    - contract_execute
  tcpa_can_spam_review_required: true

scoring:
  min_lot_sqft: 5000
  # Used as the default floor in GET /parcels?qualified_only=true (override with min_score=).
  qualified_min_score: 70
  weights:
    zoning_permitted_surface_parking: 35
    zoning_conditional_surface_parking: 12
    lot_size: 18
    corner_lot: 8
    near_demand_generator_m: 24
    near_paid_parking_comps: 15
  demand_generator_buffer_m: 400
  parking_rate_comp_radius_m: 2500
  parking_rate_comp_expanded_radius_m: 7500
  parking_rate_comp_min_for_full_credit: 2
  parking_rate_comp_max_used: 8
  # Indicative surface rates when no comps within expanded radius (revenue only — low confidence).
  parking_rate_fallbacks:
    default_hourly_mid_usd: 8.0
    default_source_note: "Pilot default unmanned surface lot indicative rate"
    confidence_factor: 0.55
    counties:
      "24510":
        hourly_mid_usd: 9.5
        source_note: "Baltimore City unmanned surface indicative — replace with verified comps"
      "24005":
        hourly_mid_usd: 8.5
        source_note: "Baltimore County surface indicative"
      "53033":
        hourly_mid_usd: 10.0
        source_note: "King County surface indicative — seed DB comps for better accuracy"
      "53053":
        hourly_mid_usd: 9.0
        source_note: "Pierce County surface indicative"
      "53061":
        hourly_mid_usd: 9.5
        source_note: "Snohomish County surface indicative"
  poi_demand:
    radius_m: 400
    saturation_count: 12
    min_occupancy_factor: 0.40
    max_occupancy_factor: 1.05
  # Illustrative gross revenue — hours, occupancy, optional net after rent/operator.
  revenue_assumptions:
    hours_per_day: 10.0
    days_per_month: 22.0
    base_occupancy: 0.55
    footprint_sqft_cap_ratio: 1.15
    land_rent_pct_of_gross: 0.15
    operator_margin_pct_of_gross: 0.25
  # Demand POIs — tier A/B Baltimore YAML + Seattle inline; OSM POI density for smaller retail.
  demand_generators_paths:
    - demand_generators_baltimore.yaml
    - demand_generators_baltimore_tier_b.yaml
  demand_generators:
    - name: "Seattle downtown retail core"
      lat: 47.6062
      lon: -122.3321
    - name: "Pike Place Market"
      lat: 47.6090
      lon: -122.3415
    - name: "Seattle Center / Climate Pledge Arena"
      lat: 47.6221
      lon: -122.3540
    - name: "Capitol Hill business district"
      lat: 47.6253
      lon: -122.3222
    - name: "UW Medical Center / Montlake"
      lat: 47.6490
      lon: -122.3070
    - name: "Bellevue downtown"
      lat: 47.6101
      lon: -122.2015
  # Illustrative paid-parking benchmarks (merged with DB ``parking_rate_comps`` at score + deal-context time).
  parking_rate_comps:
    - name: "Downtown Baltimore garage (illustrative)"
      lat: 39.2904
      lon: -76.6122
      hourly_mid_usd: 11.0
      source_note: "Pilot placeholder — Baltimore priority market"
    - name: "Downtown Seattle garage (illustrative)"
      lat: 47.6062
      lon: -122.3321
      hourly_mid_usd: 12.0
      source_note: "Pilot placeholder — replace with verified comps in DB or vendor feed"
    - name: "Capitol Hill surface (illustrative)"
      lat: 47.6253
      lon: -122.3222
      hourly_mid_usd: 9.5
      source_note: "Pilot placeholder"

data_sources:
  parcel_vendor: "TBD — see docs/washington-data.md"
  zoning_vendor: "docs/zoning-sources-*.md + data/zoning/wa/wa_county_surface_parking_rules.yaml (plus kent_king compatibility rules)"
  poi_source: "demand_generators_baltimore*.yaml + OSM Overpass (refresh-poi-density)"
