  primary_metro_cbsa: "42660" # Seattle-Tacoma-Bellevue, WA

deal:
  primary_structure: ground_lease
  allowed_structures:
    - ground_lease
    - purchase_option
  templates_require_legal_review: true
  auto_approve_deal_memo_publish: true

compliance:
  allowed_outreach_channels: []
  require_human_approval_for:
    - outbound_message
    - contract_send
    - contract_execute
  tcpa_can_spam_review_required: true

scoring:
  min_lot_sqft: 5000
  # Used as the default floor in GET /parcels?qualified_only=true (override with min_score=).
  qualified_min_score: 55
  weights:
    zoning_permitted_surface_parking: 35
    lot_size: 18
    corner_lot: 8
    near_demand_generator_m: 24
    near_paid_parking_comps: 15
  demand_generator_buffer_m: 400
  parking_rate_comp_radius_m: 2500
  parking_rate_comp_min_for_full_credit: 2
  parking_rate_comp_max_used: 8
  # Lat/lon POIs for “near demand” scoring
  demand_generators:
    - name: "Inner Harbor / downtown Baltimore (illustrative)"
      lat: 39.2851
      lon: -76.6105
    - name: "Seattle downtown (illustrative)"
      lat: 47.6062
      lon: -122.3321
  # Illustrative paid-parking benchmarks (merged with DB ``parking_rate_comps`` at score + deal-context time).
  parking_rate_comps:
    - name: "Downtown Baltimore garage (illustrative)"
      lat: 39.2904
      lon: -76.6122
      hourly_mid_usd: 11.0
      source_note: "Pilot placeholder — Baltimore priority market"
    - name: "Downtown Seattle garage (illustrative)"
      lat: 47.6062
      lon: -122.3321
      hourly_mid_usd: 12.0
      source_note: "Pilot placeholder — replace with verified comps in DB or vendor feed"
    - name: "Capitol Hill surface (illustrative)"
      lat: 47.6253
      lon: -122.3222
      hourly_mid_usd: 9.5
      source_note: "Pilot placeholder"

data_sources:
  parcel_vendor: "TBD — see docs/washington-data.md"
  zoning_vendor: "docs/zoning-sources-kent.md + data/zoning/wa/kent_king_surface_parking_rules.yaml"
  poi_source: "osm_or_commercial_tbd"
