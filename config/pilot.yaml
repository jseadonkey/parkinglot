# King County — Kent pilot (Kent city + unincorporated King County)
# CRS for stored geometries (PostGIS).
crs: EPSG:4326

region:
  name: "King County — Kent pilot"
  state_fips: "53"
  # King County only — no statewide ingest until pilot is proven here.
  county_fips:
    - "53033" # King
  primary_metro_cbsa: "42660" # Seattle-Tacoma-Bellevue, WA
  in_scope:
    kent_city_boundary_geojson: data/boundaries/wa/kent_city_census_places.geojson
    excluded_incorporated_places_geojson: data/boundaries/wa/king_county_incorporated_excluding_kent.geojson

deal:
  primary_structure: master_lease
  allowed_structures:
    - master_lease
    - ground_lease
  templates_require_legal_review: true
  operations:
    site_use: standalone_unmanned_parking_lot
    lease_model: master_lease
    summary: >
      Master-lease land for standalone, unmanned surface parking only — no attendants,
      no valet, no staffed garages. We operate pay-by-app or similar unmanned surface lots.
    partial_lot_note: >
      A site may still qualify if the owner developed part of the lot (e.g. building on
      one half) while a suitable undeveloped portion remains for unmanned parking — subject
      to zoning, access, and counsel review. The building-value prescreen (≤70% of assessed
      total) is a roll-data proxy for "room left on the lot," not a site visit.
    excluded:
      - accessory parking only (serving another building as the sole use)
      - attended or valet parking
      - structured parking garages we would staff
      - mixed-use projects where parking is not the primary master-lease use

compliance:
  allowed_outreach_channels: []
  require_human_approval_for:
    - outbound_message
    - contract_send
    - contract_execute
  tcpa_can_spam_review_required: true

scoring:
  min_lot_sqft: 5000
  # Used as the default floor in GET /parcels?qualified_only=true (override with min_score=).
  qualified_min_score: 55
  weights:
    zoning_permitted_surface_parking: 40
    lot_size: 20
    corner_lot: 10
    near_demand_generator_m: 30
    near_parking_comp_m: 0
  demand_generator_buffer_m: 400
  parking_comp_market:
    enabled: false
    comps_path: data/pilot/kent_king_parking_comps.yaml
    buffer_m: 800
    min_rate_usd_per_day: 6.0
    premium_rate_usd_per_day: 15.0
  # Kent / south King submarket POIs (centroid → great-circle meters).
  demand_generators:
    - name: "Kent Station (illustrative)"
      lat: 47.3854
      lon: -122.2399
    - name: "Aurora corridor — Federal Way border (illustrative)"
      lat: 47.35
      lon: -122.31

data_sources:
  parcel_vendor: "King County — see docs/washington-data.md"
  zoning_vendor: "docs/zoning-sources-kent.md + data/zoning/wa/kent_king_surface_parking_rules.yaml"
  poi_source: "osm_or_commercial_tbd"
