# Surface parking suitability by zone code (Kent city + King unincorporated).
# NOT LEGAL ADVICE — operational scoring flags from published land-use tables.
#
# Scoring context (see docs/OPERATIONS-MODEL.md):
#   We master-lease land for STANDALONE UNMANNED SURFACE PARKING as the primary use.
#   Accessory-only parking for another building is out of scope even when "P" for off-street parking.
#   Partially developed lots (e.g. half built / half empty) may qualify on the empty portion — counsel review.
#
# allows_surface_parking: true
#   Primary-use commercial / commuter / automotive parking has a permit path
#   (P = permitted, M = minor conditional, C = conditional) in the cited ordinance table.
# allows_surface_parking: false
#   Residential, agriculture, forestry, mineral, or district where parking-as-primary-use
#   is not listed / is prohibited (accessory parking only).
#
# Unknown codes use default_when_unknown (conservative false).
# Overlay suffixes (-P, -SO, -DPA, -P-SO) fall back to the base code when not listed explicitly.

version: 2
default_when_unknown: false

