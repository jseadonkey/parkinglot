        principal_use_symbol: CB
        note: "C-5 Historic/Traditional — CB."

      # --- Tier 3: CO (Mayor & City Council ordinance) — deprioritize ---
      "C-5":
        allows_surface_parking: false
        principal_use_symbol: CO
        note: "Table 10-301 — downtown C-5 base is CO, not P; many existing lots are grandfathered by ordinance."
      "C-5-G":
        allows_surface_parking: false
        principal_use_symbol: CO
        note: "C-5 G gateway subdistrict — CO."
      "IMU-1":
        allows_surface_parking: false
        principal_use_symbol: CO
        note: "Table 11-301 CO."
      "R-5":
        allows_surface_parking: false
        principal_use_symbol: CO
        note: "Table 9-301 — rowhouse/multi-family; CO only (rare for acquisitions)."
      "R-6":
        allows_surface_parking: false
        principal_use_symbol: CO
      "R-7":
        allows_surface_parking: false
        principal_use_symbol: CO
      "R-8":
        allows_surface_parking: false
        principal_use_symbol: CO
      "R-9":
        allows_surface_parking: false
