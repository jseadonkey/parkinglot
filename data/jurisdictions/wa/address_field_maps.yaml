# County/city situs + mailing field maps for ingest normalization.
# See docs/JURISDICTION-ZONING-COMPLETENESS-PLAN.md §5.6 and parking_ingestion/address_normalize.py.

default_wa_watech:
  address_source: watech_statewide
  situs_street:
    - SITUS_ADDRESS
    - situs_address
    - SITUS_ADDR
    - situs_addr
    - ADDR_FULL
    - addr_full
    - FULLADDR
    - fulladdr
    - PROPERTY_ADDRESS
    - property_address
    - LOC_STREET
    - loc_street
    - SITE_ADDR
    - site_addr
    - SUB_ADDRESS
    - sub_address
  situs_city:
    - SITUS_CITY_NM
    - SITUS_CITY
    - situs_city
    - LOC_CITY
    - loc_city
    - CITY
    - city
  situs_state:
    - SITUS_STATE
    - situs_state
    - STATE
    - state
  situs_zip:
    - SITUS_ZIP_NR
    - SITUS_ZIP
    - situs_zip
    - ZIP5
    - zip
    - POSTAL_CODE
  mailing:
    - MAILING_ADDRESS
    - mailing_address
    - MAIL_ADDR
    - mail_addr
    - MAILTOADD
    - mailtoadd
    - FULL_MAILING
    - full_mailing
  owner:
    - OWNER_NAME
    - owner_name
    - TAXPAYER_NAME
    - taxpayer_name

counties:
  "53033":
    inherit: default_wa_watech
    address_source: watech_king
    notes: "King — WaTech statewide layer; assessor roll merge planned (King County GIS)."
  "53053":
    inherit: default_wa_watech
    address_source: watech_pierce
    situs_street:
      - Site_Address
      - SITUS_ADDRESS
      - PROPERTY_ADDRESS
    situs_city:
      - City_State
      - SITUS_CITY_NM
      - SITUS_CITY
    situs_zip:
      - Zipcode
      - SITUS_ZIP_NR
      - SITUS_ZIP
    mailing:
      - Delivery_Address
      - MAILING_ADDRESS
    owner:
      - Business_Name
      - OWNER_NAME
    notes: "Pierce — county Tax_Parcels service exposes Site_Address/City_State/Zipcode."
  "53061":
    inherit: default_wa_watech
    address_source: watech_snohomish
    situs_street:
      - SITUSLINE1
      - SITUS_ADDRESS
      - PROPERTY_ADDRESS
    situs_city:
      - SITUSCITY
      - SITUS_CITY_NM
      - SITUS_CITY
    situs_state:
      - SITUSSTATE
      - SITUS_STATE
    situs_zip:
      - SITUSZIP
      - SITUS_ZIP_NR
      - SITUS_ZIP
    mailing:
      - TAXPRLINE1
      - OWNERLINE1
      - MAILING_ADDRESS
    owner:
      - OWNERNAME
      - TAXPRNAME
      - OWNER_NAME
    notes: "Snohomish — public Parcels FeatureServer exposes SITUSLINE1/SITUSCITY/SITUSZIP."
  "53035":
    inherit: default_wa_watech
    address_source: watech_kitsap
    situs_street:
      - SITUS_ADDRESS
      - SUB_ADDRESS
      - PROPERTY_ADDRESS
    situs_city:
      - SITUS_CITY_NM
      - SITUS_CITY
    situs_zip:
      - SITUS_ZIP_NR
      - SITUS_ZIP
    notes: "Kitsap — county parcel service follows WaTech normalized situs fields."
  "53067":
    inherit: default_wa_watech
    address_source: watech_thurston
    situs_street:
      - SITUS_STRE
      - SITUS_ADDRESS
      - PROPERTY_ADDRESS
    situs_city:
      - SITUS_CITY
      - SITUS_CITY_NM
    situs_zip:
      - SITUS_ZIP
      - SITUS_ZIP_NR
    mailing:
      - ADDRESS1
      - ADDRESS2
      - MAILING_ADDRESS
    owner:
      - OWNER_NAME
    notes: "Thurston — county parcel service exposes SITUS_STRE/SITUS_CITY/SITUS_ZIP."
  "24510":
    address_source: baltimore_realproperty
    notes: "Baltimore City — normalized in baltimore_parcels.py / address backfill batch."
