# County/city situs + mailing field maps for ingest normalization.
# Generated by scripts/generate_wa_county_templates.py.

default_wa_watech:
  address_source: watech_statewide
  situs_street:
  - SITUS_ADDRESS
  - situs_address
  - SITUS_ADDR
  - situs_addr
  - ADDR_FULL
  - addr_full
  - FULLADDR
  - fulladdr
  - PROPERTY_ADDRESS
  - property_address
  - LOC_STREET
  - loc_street
  - SITE_ADDR
  - site_addr
  - SUB_ADDRESS
  - sub_address
  situs_city:
  - SITUS_CITY_NM
  - SITUS_CITY
  - situs_city
  - LOC_CITY
  - loc_city
  - CITY
  - city
  situs_state:
  - SITUS_STATE
  - situs_state
  - STATE
  - state
  situs_zip:
  - SITUS_ZIP_NR
  - SITUS_ZIP
  - situs_zip
  - ZIP5
  - zip
  - POSTAL_CODE
  mailing:
  - MAILING_ADDRESS
  - mailing_address
  - MAIL_ADDR
  - mail_addr
  - MAILTOADD
  - mailtoadd
  - FULL_MAILING
  - full_mailing
  owner:
  - OWNER_NAME
  - owner_name
  - TAXPAYER_NAME
  - taxpayer_name
