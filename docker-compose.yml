services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking
      POSTGRES_DB: parking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d parking"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minio minio12345;
      mc mb -p local/parking-drafts || true;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+psycopg://parking:parking@postgres:5432/parking
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PILOT_CONFIG_PATH: /app/config/pilot.yaml
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minio
      STORAGE_SECRET_KEY: minio12345
      STORAGE_BUCKET: parking-drafts
      STORAGE_REGION: us-east-1
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["celery", "-A", "app.celery_app", "worker", "-l", "INFO"]
    environment:
      DATABASE_URL: postgresql+psycopg://parking:parking@postgres:5432/parking
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PILOT_CONFIG_PATH: /app/config/pilot.yaml
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minio
      STORAGE_SECRET_KEY: minio12345
      STORAGE_BUCKET: parking-drafts
      STORAGE_REGION: us-east-1
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_DIGEST_CHANNEL_ID: ${SLACK_DIGEST_CHANNEL_ID:-}
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["celery", "-A", "app.celery_app", "beat", "-l", "INFO"]
    environment:
      DATABASE_URL: postgresql+psycopg://parking:parking@postgres:5432/parking
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      PILOT_CONFIG_PATH: /app/config/pilot.yaml
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minio
      STORAGE_SECRET_KEY: minio12345
      STORAGE_BUCKET: parking-drafts
      STORAGE_REGION: us-east-1
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_DIGEST_CHANNEL_ID: ${SLACK_DIGEST_CHANNEL_ID:-}
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  approval-ui:
    build:
      context: .
      dockerfile: apps/approval-ui/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
